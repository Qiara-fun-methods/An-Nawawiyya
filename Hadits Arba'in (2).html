mat Allah. Seorang Muslim hendaknya menerima tuntunan syariat tanpa meremehkan kewajiban, melanggar larangan, atau memberat-beratkan agama dengan pertanyaan yang tidak bermanfaat.","en":"This hadith explains four matters in Islamic law: obligations that must be fulfilled, limits that must not be exceeded, prohibitions that must be avoided, and matters left unspecified as a mercy from Allah. A Muslim should follow the guidance of the religion without neglecting duties, violating prohibitions, or burdening the religion with unnecessary questions.","ar":"يُبَيِّنُ الْحَدِيثُ أَرْبَعَةَ أُمُورٍ: الْفَرَائِضَ الَّتِي يَجِبُ أَدَاؤُهَا، وَالْحُدُودَ الَّتِي لَا يَجُوزُ تَجَاوُزُهَا، وَالْمُحَرَّمَاتِ الَّتِي يَجِبُ اجْتِنَابُهَا، وَمَا سَكَتَ عَنْهُ الشَّرْعُ رَحْمَةً بِالْعِبَادِ."},"n":["Abu Tsa'labah Al-Khusyani"],"na":["أبو ثعلبة الخشني"],"hn":["رضي الله عنه"],"im":["dq"],"no":[4350],"g":"h","s":"Sunan Ad-Daraquthni no. 4350 dan riwayat lainnya; dinilai hasan oleh Imam An-Nawawi.","mk":"رواه الدارقطني برقم ٤٣٥٠ وغيره، وحسّنه النووي."},{"i":31,"t":{"id":"Zuhud terhadap Dunia","en":"Renouncing Worldly Attachment","ar":"الزهد في الدنيا"},"a":"عَنْ أَبِي الْعَبَّاسِ سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ رَضِيَ اللَّهُ عَنْهُ قَالَ: جَاءَ رَجُلٌ إِلَى النَّبِيِّ ﷺ فَقَالَ: يَا رَسُولَ اللَّهِ، دُلَّنِي عَلَى عَمَلٍ إِذَا عَمِلْتُهُ أَحَبَّنِي اللَّهُ وَأَحَبَّنِي النَّاسُ. فَقَالَ: «ازْهَدْ فِي الدُّنْيَا يُحِبَّكَ اللَّهُ، وَازْهَدْ فِيمَا عِنْدَ النَّاسِ يُحِبَّكَ النَّاسُ».","m":{"id":"Dari Abu Abbas Sahl bin Sa'd As-Sa'idi رضي الله عنه, ia berkata: Seorang laki-laki datang kepada Nabi ﷺ dan berkata, “Wahai Rasulullah, tunjukkanlah kepadaku suatu amalan yang apabila aku lakukan, Allah akan mencintaiku dan manusia juga akan mencintaiku.” Beliau bersabda, “Zuhudlah terhadap dunia, niscaya Allah mencintaimu. Dan zuhudlah terhadap apa yang dimiliki manusia, niscaya manusia mencintaimu.”","en":"Abu al-Abbas Sahl ibn Sa'd as-Sa'idi رضي الله عنه reported that a man came to the Prophet ﷺ and said, “O Messenger of Allah, show me a deed which, if I do it, Allah will love me and people will love me.” He replied, “Be detached from worldly possessions, and Allah will love you. Be detached from what people possess, and people will love you.”"},"e":{"id":"Zuhud bukan berarti mengharamkan hal-hal yang halal atau meninggalkan usaha mencari rezeki. Zuhud adalah tidak menjadikan dunia sebagai tujuan utama hati dan tidak menggantungkan diri pada harta milik orang lain. Seorang Muslim boleh memiliki harta, tetapi hatinya tetap bergantung kepada Allah dan tidak rakus terhadap milik manusia.","en":"Zuhd does not mean declaring lawful things forbidden or abandoning the effort to earn a living. It means not making worldly life the ultimate goal of one's heart and not coveting what belongs to others. A Muslim may possess wealth while keeping their heart attached to Allah rather than to worldly possessions.","ar":"الزُّهْدُ لَيْسَ تَحْرِيمَ الْحَلَالِ وَلَا تَرْكَ السَّعْيِ فِي الرِّزْقِ، وَإِنَّمَا هُوَ عَدَمُ تَعَلُّقِ الْقَلْبِ بِالدُّنْيَا وَعَدَمُ الطَّمَعِ فِيمَا فِي أَيْدِي النَّاسِ."},"n":["Sahl bin Sa'd"],"na":["سهل بن سعد"],"hn":["رضي الله عنه"],"im":["ma"],"no":[4102],"g":"h","s":"Sunan Ibnu Majah no. 4102; diriwayatkan pula oleh selainnya. Dinilai hasan oleh sejumlah ulama.","mk":"رواه ابن ماجه برقم ٤١٠٢ وغيره، وحسّنه عدد من العلماء."},{"i":32,"t":{"id":"Tidak Boleh Membahayakan Diri dan Orang Lain","en":"No Harm and No Reciprocal Harm","ar":"لا ضرر ولا ضرار"},"a":"عَنْ أَبِي سَعِيدٍ سَعْدِ بْنِ مَالِكِ بْنِ سِنَانٍ الْخُدْرِيِّ رَضِيَ اللَّهُ عَنْهُ، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ: «لَا ضَرَرَ وَلَا ضِرَارَ».","m":{"id":"Dari Abu Sa'id Sa'd bin Malik bin Sinan Al-Khudri رضي الله عنه, bahwa Rasulullah ﷺ bersabda, “Tidak boleh membahayakan diri sendiri dan tidak boleh membahayakan orang lain.”","en":"Abu Sa'id Sa'd ibn Malik ibn Sinan al-Khudri رضي الله عنه reported that the Messenger of Allah ﷺ said, “There should be neither harm nor reciprocating harm.”"},"e":{"id":"Hadits ini merupakan salah satu kaidah penting dalam fikih Islam. Seorang Muslim tidak boleh sengaja melakukan sesuatu yang membahayakan dirinya atau orang lain tanpa alasan yang dibenarkan syariat. Kaidah ini menjadi dasar dalam banyak pembahasan fikih, seperti transaksi, hubungan sosial, hak tetangga, dan pencegahan kerugian.","en":"This hadith is one of the important legal principles in Islamic jurisprudence. A Muslim must not deliberately cause harm to themselves or others without a valid legal justification. This principle is applied in many areas of Islamic law, including transactions, social relations, neighbors' rights, and preventing injury.","ar":"هَذَا الْحَدِيثُ مِنَ الْقَوَاعِدِ الْكُلِّيَّةِ فِي الْفِقْهِ الْإِسْلَامِيِّ، وَيَدُلُّ عَلَى تَحْرِيمِ إِيقَاعِ الضَّرَرِ بِالنَّفْسِ أَوْ بِالْغَيْرِ بِغَيْرِ حَقٍّ."},"n":["Abu Sa'id Al-Khudri"],"na":["أبو سعيد الخدري"],"hn":["رضي الله عنه"],"im":["ma","ml"],"no":[2340,0],"g":"","s":"Sunan Ibnu Majah no. 2340; Al-Muwaththa' Imam Malik, Kitab Al-Aqdiyah. Diriwayatkan melalui beberapa jalur.","mk":"رواه ابن ماجه برقم ٢٣٤٠، ومالك في الموطأ، كتاب الأقضية، من عدة طرق."},{"i":33,"t":{"id":"Bukti bagi Penuntut dan Sumpah bagi Pengingkar","en":"Evidence Is Required from the Claimant","ar":"البينة على المدعي واليمين على من أنكر"},"a":"عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا، أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ: «لَوْ يُعْطَى النَّاسُ بِدَعْوَاهُمْ، لَادَّعَى رِجَالٌ أَمْوَالَ قَوْمٍ وَدِمَاءَهُمْ، وَلَكِنَّ الْبَيِّنَةَ عَلَى الْمُدَّعِي، وَالْيَمِينَ عَلَى مَنْ أَنْكَرَ».","m":{"id":"Dari Ibnu Abbas رضي الله عنهما, bahwa Rasulullah ﷺ bersabda, “Seandainya setiap orang diberi apa yang mereka klaim begitu saja, niscaya orang-orang akan mengklaim harta dan darah milik orang lain. Akan tetapi, bukti wajib diajukan oleh pihak yang menuntut, sedangkan sumpah diberikan oleh pihak yang mengingkari.”","en":"Ibn Abbas رضي الله عنهما reported that the Messenger of Allah ﷺ said, “If people were given everything they claimed, some would claim the wealth and blood of others. Rather, proof is required from the claimant, and the oath is upon the one who denies the claim.”"},"e":{"id":"Hadits ini menjelaskan prinsip keadilan dalam penyelesaian sengketa. Seseorang tidak cukup hanya mengaku memiliki hak atas sesuatu; ia harus menghadirkan bukti. Dalam perkara yang memenuhi ketentuan hukum, pihak yang mengingkari dapat diminta bersumpah. Penerapannya berada dalam ranah peradilan dan ketentuan hukum yang dijelaskan para ulama.","en":"This hadith establishes an important principle of justice in resolving disputes. A person cannot simply claim ownership or rights without evidence. Under the relevant legal conditions, the person denying the claim may be required to take an oath. Its application belongs to judicial proceedings and the legal conditions explained by scholars.","ar":"يُقَرِّرُ الْحَدِيثُ أَصْلًا عَظِيمًا فِي الْقَضَاءِ، وَهُوَ أَنَّ الْمُدَّعِيَ يُطَالَبُ بِالْبَيِّنَةِ، وَأَنَّ الْيَمِينَ تَكُونُ عَلَى الْمُنْكِرِ وَفْقَ شُرُوطِهَا الشَّرْعِيَّةِ."},"n":["Abdullah bin Abbas"],"na":["عبد الله بن عباس"],"hn":["رضي الله عنهما"],"im":["bh"],"no":[0],"g":"","s":"Al-Baihaqi, As-Sunan Al-Kubra; diriwayatkan pula dalam kitab-kitab hadits lainnya. Maknanya memiliki dasar dalam riwayat shahih.","mk":"رواه البيهقي في السنن الكبرى وغيره، ولمعناه أصل في الروايات الصحيحة."},{"i":34,"t":{"id":"Mengubah Kemungkaran","en":"Changing Evil","ar":"تغيير المنكر"},"a":"عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ رَضِيَ اللَّهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ: «مَنْ رَأَى مِنْكُمْ مُنْكَرًا فَلْيُغَيِّرْهُ بِيَدِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِلِسَانِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِقَلْبِهِ، وَذَلِكَ أَضْعَفُ الْإِيمَانِ».","m":{"id":"Dari Abu Sa'id Al-Khudri رضي الله عنه, ia berkata: Aku mendengar Rasulullah ﷺ bersabda, “Barang siapa di antara kalian melihat suatu kemungkaran, hendaklah ia mengubahnya dengan tangannya. Jika tidak mampu, maka dengan lisannya. Jika tidak mampu juga, maka dengan hatinya, dan itulah selemah-lemahnya iman.”","en":"Abu Sa'id al-Khudri رضي الله عنه reported: I heard the Messenger of Allah ﷺ say, “Whoever among you sees an evil, let him change it with his hand. If he is unable, then with his tongue. If he is unable, then with his heart, and that is the weakest level of faith.”"},"e":{"id":"Hadits ini memerintahkan umat Islam untuk tidak merelakan kemungkaran. Mengubah dengan tangan harus dilakukan oleh orang yang memiliki kewenangan dan kemampuan yang sah, tanpa menimbulkan kemungkaran atau kerusakan yang lebih besar. Dengan lisan dilakukan melalui nasihat dan penjelasan yang sesuai. Mengingkari dengan hati berarti membenci kemungkaran dan tidak meridhainya.","en":"This hadith teaches Muslims not to approve of wrongdoing. Changing evil by hand belongs to those with legitimate authority and ability, and must not cause greater harm or wrongdoing. Changing it by speech means advising and explaining appropriately. Rejecting it in the heart means disliking the evil and not approving of it.","ar":"يَأْمُرُ الْحَدِيثُ بِإِنْكَارِ الْمُنْكَرِ، وَيَكُونُ التَّغْيِيرُ بِالْيَدِ لِمَنْ لَهُ الْقُدْرَةُ وَالْوِلَايَةُ الشَّرْعِيَّةُ، مَعَ مُرَاعَاةِ عَدَمِ حُصُولِ مُنْكَرٍ أَكْبَرَ، وَبِاللِّسَانِ بِالنَّصِيحَةِ، وَبِالْقَلْبِ بِكَرَاهِيَةِ الْمُنْكَرِ."},"n":["Abu Sa'id Al-Khudri"],"na":["أبو سعيد الخدري"],"hn":["رضي الله عنه"],"im":["mu"],"no":[49],"g":"","s":"Shahih Muslim no. 49","mk":"رواه مسلم برقم ٤٩."},{"i":35,"t":{"id":"Persaudaraan dan Larangan Saling Membenci","en":"Brotherhood and the Prohibition of Hatred","ar":"الأخوة الإسلامية وترك التباغض"},"a":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ: «لَا تَحَاسَدُوا، وَلَا تَنَاجَشُوا، وَلَا تَبَاغَضُوا، وَلَا تَدَابَرُوا، وَلَا يَبِعْ بَعْضُكُمْ عَلَى بَيْعِ بَعْضٍ، وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا. الْمُسْلِمُ أَخُو الْمُسْلِمِ، لَا يَظْلِمُهُ، وَلَا يَخْذُلُهُ، وَلَا يَكْذِبُهُ، وَلَا يَحْقِرُهُ. التَّقْوَى هَاهُنَا» - وَيُشِيرُ إِلَى صَدْرِهِ ثَلَاثَ مَرَّاتٍ - «بِحَسْبِ امْرِئٍ مِنَ الشَّرِّ أَنْ يَحْقِرَ أَخَاهُ الْمُسْلِمَ. كُلُّ الْمُسْلِمِ عَلَى الْمُسْلِمِ حَرَامٌ: دَمُهُ وَمَالُهُ وَعِرْضُهُ».","m":{"id":"Dari Abu Hurairah رضي الله عنه, ia berkata bahwa Rasulullah ﷺ bersabda, “Janganlah kalian saling dengki, jangan saling menaikkan harga secara palsu, jangan saling membenci, jangan saling membelakangi, dan janganlah sebagian kalian melakukan transaksi jual beli di atas transaksi jual beli sebagian yang lain. Jadilah kalian hamba-hamba Allah yang bersaudara. Seorang Muslim adalah saudara bagi Muslim lainnya: ia tidak menzaliminya, tidak membiarkannya dalam kesulitan, tidak mendustainya, dan tidak merendahkannya. Takwa itu ada di sini,” beliau menunjuk ke dadanya tiga kali. “Cukuplah seseorang dianggap melakukan keburukan apabila ia merendahkan saudaranya sesama Muslim. Setiap Muslim haram atas Muslim lainnya darahnya, hartanya, dan kehormatannya.”","en":"Abu Hurairah رضي الله عنه reported that the Messenger of Allah ﷺ said, “Do not envy one another, do not artificially inflate prices, do not hate one another, do not turn away from one another, and do not undercut one another in sales. Be servants of Allah as brothers. A Muslim is the brother of another Muslim: he does not wrong him, abandon him, lie to him, or despise him. Taqwa is here,” and he pointed to his chest three times. “It is enough evil for a person to despise his Muslim brother. The blood, property, and honor of every Muslim are inviolable to another Muslim.”"},"e":{"id":"Hadits ini mengajarkan persaudaraan Islam dan melarang berbagai perilaku yang merusak hubungan antarsesama, seperti hasad, penipuan dalam jual beli, kebencian, dan penghinaan. Takwa bukan sekadar penampilan lahiriah, tetapi berkaitan dengan keadaan hati dan ketaatan kepada Allah. Darah, harta, serta kehormatan seorang Muslim wajib dihormati dan dijaga.","en":"This hadith teaches Islamic brotherhood and prohibits behaviors that damage relationships, such as envy, deceptive trading practices, hatred, and humiliation. Taqwa is not merely outward appearance; it is connected to the state of the heart and obedience to Allah. The life, property, and honor of a Muslim must be respected and protected.","ar":"يُرَسِّخُ الْحَدِيثُ مَعْنَى الْأُخُوَّةِ الْإِسْلَامِيَّةِ، وَيَنْهَى عَنِ الْحَسَدِ وَالْغِشِّ وَالتَّبَاغُضِ وَاحْتِقَارِ الْمُسْلِمِينَ، وَيُؤَكِّدُ حُرْمَةَ دِمَاءِ الْمُسْلِمِينَ وَأَمْوَالِهِمْ وَأَعْرَاضِهِمْ."},"n":["Abu Hurairah"],"na":["أبو هريرة"],"hn":["رضي الله عنه"],"im":["mu"],"no":[2564],"g":"","s":"Shahih Muslim no. 2564","mk":"رواه مسلم برقم ٢٥٦٤."},{"i":36,"t":{"id":"Keutamaan Menolong Sesama Muslim","en":"The Virtue of Helping Others","ar":"فضل قضاء حوائج المسلمين"},"a":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ، عَنِ النَّبِيِّ ﷺ قَالَ: «مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ، وَمَنْ يَسَّرَ عَلَى مُعْسِرٍ يَسَّرَ اللَّهُ عَلَيْهِ فِي الدُّنْيَا وَالْآخِرَةِ، وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ فِي الدُّنْيَا وَالْآخِرَةِ، وَاللَّهُ فِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ أَخِيهِ، وَمَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ، وَمَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللَّهِ يَتْلُونَ كِتَابَ اللَّهِ وَيَتَدَارَسُونَهُ فِيمَا بَيْنَهُمْ إِلَّا نَزَلَتْ عَلَيْهِمُ السَّكِينَةُ، وَغَشِيَتْهُمُ الرَّحْمَةُ، وَحَفَّتْهُمُ الْمَلَائِكَةُ، وَذَكَرَهُمُ اللَّهُ فِيمَنْ عِنْدَهُ، وَمَنْ أَبْطَأَ بِهِ عَمَلُهُ لَمْ يُسْرِعْ بِهِ نَسَبُهُ».","m":{"id":"Dari Abu Hurairah رضي الله عنه, dari Nabi ﷺ, beliau bersabda, “Barang siapa menghilangkan satu kesusahan dari seorang mukmin di antara kesusahan-kesusahan dunia, Allah akan menghilangkan darinya satu kesusahan di antara kesusahan-kesusahan hari Kiamat. Barang siapa memberi kemudahan kepada orang yang kesulitan, Allah akan memberinya kemudahan di dunia dan akhirat. Barang siapa menutupi aib seorang Muslim, Allah akan menutupi aibnya di dunia dan akhirat. Allah senantiasa menolong seorang hamba selama hamba itu menolong saudaranya. Barang siapa menempuh suatu jalan untuk mencari ilmu, Allah akan memudahkan baginya jalan menuju surga. Tidaklah suatu kaum berkumpul di salah satu rumah Allah, membaca Kitab Allah dan mempelajarinya bersama-sama, melainkan ketenangan turun kepada mereka, rahmat meliputi mereka, para malaikat mengelilingi mereka, dan Allah menyebut mereka di hadapan makhluk yang ada di sisi-Nya. Barang siapa diperlambat oleh amalnya, nasabnya tidak akan dapat mempercepatnya.”","en":"Abu Hurairah رضي الله عنه reported that the Prophet ﷺ said, “Whoever relieves a believer of a hardship in this world, Allah will relieve him of a hardship on the Day of Resurrection. Whoever makes things easier for someone in difficulty, Allah will make things easier for him in this world and the Hereafter. Whoever conceals the faults of a Muslim, Allah will conceal his faults in this world and the Hereafter. Allah continues to help His servant as long as the servant helps his brother. Whoever follows a path seeking knowledge, Allah will make a path to Paradise easy for him. No people gather in one of the houses of Allah, reciting the Book of Allah and studying it together, except that tranquility descends upon them, mercy covers them, angels surround them, and Allah mentions them among those who are with Him. Whoever is held back by his deeds will not be moved forward by his lineage.”"},"e":{"id":"Hadits ini mengajarkan kepedulian sosial, membantu orang yang kesulitan, menjaga kehormatan sesama Muslim, dan semangat menuntut ilmu. Keutamaan berkumpul untuk membaca serta mempelajari Al-Qur'an juga dijelaskan secara khusus. Kemuliaan seseorang di sisi Allah tidak ditentukan oleh keturunan atau kedudukan, tetapi oleh iman dan amalnya.","en":"This hadith teaches social care, helping people in difficulty, protecting the dignity of fellow Muslims, and seeking knowledge. It also highlights the virtue of gathering to recite and study the Qur'an. A person's standing before Allah is not determined by ancestry or status, but by faith and deeds.","ar":"يَدُلُّ الْحَدِيثُ عَلَى فَضْلِ تَفْرِيجِ الْكُرُبَاتِ وَتَيْسِيرِ أُمُورِ النَّاسِ وَسَتْرِ الْمُسْلِمِينَ وَطَلَبِ الْعِلْمِ وَمَجَالِسِ الْقُرْآنِ، وَأَنَّ الْعِبْرَةَ بِالْإِيمَانِ وَالْعَمَلِ لَا بِالنَّسَبِ."},"n":["Abu Hurairah"],"na":["أبو هريرة"],"hn":["رضي الله عنه"],"im":["mu"],"no":[2699],"g":"","s":"Shahih Muslim no. 2699","mk":"رواه مسلم برقم ٢٦٩٩."},{"i":37,"t":{"id":"Luasnya Rahmat Allah dalam Pencatatan Amal","en":"The Mercy of Allah in Recording Deeds","ar":"فضل الله في كتابة الحسنات والسيئات"},"a":"عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا، عَنْ رَسُولِ اللَّهِ ﷺ فِيمَا يَرْوِيهِ عَنْ رَبِّهِ تَبَارَكَ وَتَعَالَى، قَالَ: «إِنَّ اللَّهَ كَتَبَ الْحَسَنَاتِ وَالسَّيِّئَاتِ، ثُمَّ بَيَّنَ ذَلِكَ، فَمَنْ هَمَّ بِحَسَنَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللَّهُ عِنْدَهُ حَسَنَةً كَامِلَةً، وَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللَّهُ عِنْدَهُ عَشْرَ حَسَنَاتٍ إِلَى سَبْعِمِائَةِ ضِعْفٍ إِلَى أَضْعَافٍ كَثِيرَةٍ، وَإِنْ هَمَّ بِسَيِّئَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللَّهُ عِنْدَهُ حَسَنَةً كَامِلَةً، وَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللَّهُ سَيِّئَةً وَاحِدَةً».","m":{"id":"Dari Ibnu Abbas رضي الله عنهما, dari Rasulullah ﷺ, dalam riwayat yang beliau sampaikan dari Rabbnya Tabaraka wa Ta'ala, Allah berfirman, “Sesungguhnya Allah telah menetapkan kebaikan dan keburukan, kemudian menjelaskan hal tersebut. Barang siapa berniat melakukan suatu kebaikan tetapi belum mengerjakannya, Allah mencatatnya di sisi-Nya sebagai satu kebaikan yang sempurna. Jika ia berniat lalu mengerjakannya, Allah mencatatnya sebagai sepuluh kebaikan hingga tujuh ratus kali lipat, bahkan berlipat-lipat banyaknya. Barang siapa berniat melakukan suatu keburukan tetapi tidak mengerjakannya, Allah mencatatnya di sisi-Nya sebagai satu kebaikan yang sempurna. Jika ia berniat lalu mengerjakannya, Allah mencatatnya sebagai satu keburukan.”","en":"Ibn Abbas رضي الله عنهما reported that the Messenger of Allah ﷺ narrated from his Lord, the Blessed and Exalted: “Indeed, Allah has recorded good deeds and bad deeds, then explained them. Whoever intends to do a good deed but does not do it, Allah records it as one complete good deed. If he intends it and then does it, Allah records it as ten good deeds, up to seven hundred times and many times more. Whoever intends to do a bad deed but does not do it, Allah records it as one complete good deed. If he intends it and does it, Allah records it as one bad deed.”"},"e":{"id":"Hadits qudsi ini menunjukkan betapa luasnya rahmat dan kemurahan Allah. Niat baik yang belum terlaksana tetap mendapatkan pahala, sedangkan kebaikan yang dikerjakan dilipatgandakan. Keburukan yang ditinggalkan karena Allah juga mendapatkan balasan kebaikan. Adapun dosa yang dilakukan dicatat sebagai satu keburukan, kecuali jika Allah mengampuninya.","en":"This hadith qudsi shows the vastness of Allah's mercy and generosity. A good intention that is not carried out can still receive a reward, while a good deed that is performed is multiplied. A bad deed abandoned for Allah's sake is rewarded with good, while a sin that is committed is recorded as one bad deed, unless Allah forgives it.","ar":"يُبَيِّنُ الْحَدِيثُ سَعَةَ رَحْمَةِ اللَّهِ وَفَضْلَهُ، فَالْحَسَنَةُ تُضَاعَفُ، وَالنِّيَّةُ الصَّالِحَةُ يُثَابُ عَلَيْهَا، وَمَنْ تَرَكَ السَّيِّئَةَ لِلَّهِ كُتِبَتْ لَهُ حَسَنَةٌ."},"n":["Abdullah bin Abbas"],"na":["عبد الله بن عباس"],"hn":["رضي الله عنهما"],"im":["bu","mu"],"no":[6491,131],"g":"","s":"Shahih Al-Bukhari no. 6491 dan Shahih Muslim no. 131","mk":"رواه البخاري برقم ٦٤٩١ ومسلم برقم ١٣١."},{"i":38,"t":{"id":"Mendekatkan Diri kepada Allah","en":"Drawing Near to Allah","ar":"التقرب إلى الله تعالى"},"a":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ: «إِنَّ اللَّهَ تَعَالَى قَالَ: مَنْ عَادَى لِي وَلِيًّا فَقَدْ آذَنْتُهُ بِالْحَرْبِ، وَمَا تَقَرَّبَ إِلَيَّ عَبْدِي بِشَيْءٍ أَحَبَّ إِلَيَّ مِمَّا افْتَرَضْتُهُ عَلَيْهِ، وَلَا يَزَالُ عَبْدِي يَتَقَرَّبُ إِلَيَّ بِالنَّوَافِلِ حَتَّى أُحِبَّهُ، فَإِذَا أَحْبَبْتُهُ كُنْتُ سَمْعَهُ الَّذِي يَسْمَعُ بِهِ، وَبَصَرَهُ الَّذِي يُبْصِرُ بِهِ، وَيَدَهُ الَّتِي يَبْطِشُ بِهَا، وَرِجْلَهُ الَّتِي يَمْشِي بِهَا، وَإِنْ سَأَلَنِي لَأُعْطِيَنَّهُ، وَلَئِنِ اسْتَعَاذَنِي لَأُعِيذَنَّهُ».","m":{"id":"Dari Abu Hurairah رضي الله عنه, ia berkata bahwa Rasulullah ﷺ bersabda, Allah Ta'ala berfirman, “Barang siapa memusuhi wali-Ku, sungguh Aku telah mengumumkan perang terhadapnya. Tidaklah hamba-Ku mendekatkan diri kepada-Ku dengan sesuatu yang lebih Aku cintai daripada amalan yang telah Aku wajibkan kepadanya. Hamba-Ku senantiasa mendekatkan diri kepada-Ku dengan amalan-amalan sunnah hingga Aku mencintainya. Apabila Aku telah mencintainya, Aku menjadi pendengarannya yang dengannya ia mendengar, penglihatannya yang dengannya ia melihat, tangannya yang dengannya ia memegang, dan kakinya yang dengannya ia berjalan. Jika ia meminta kepada-Ku, pasti Aku memberinya. Jika ia memohon perlindungan kepada-Ku, pasti Aku melindunginya.”","en":"Abu Hurairah رضي الله عنه reported that the Messenger of Allah ﷺ said that Allah, the Exalted, said: “Whoever shows enmity to a devoted servant of Mine, I declare war against him. My servant does not draw near to Me with anything more beloved to Me than the duties I have made obligatory upon him. My servant continues to draw near to Me through voluntary deeds until I love him. When I love him, I become his hearing with which he hears, his sight with which he sees, his hand with which he grasps, and his foot with which he walks. If he asks Me, I will surely give him; and if he seeks My protection, I will surely protect him.”"},"e":{"id":"Hadits qudsi ini menerangkan kedudukan wali Allah, yaitu orang beriman yang bertakwa. Jalan mendekatkan diri kepada Allah dimulai dengan menjaga kewajiban, kemudian memperbanyak amalan sunnah. Ungkapan Allah menjadi pendengaran dan penglihatan hamba tidak berarti Allah menyatu dengan makhluk. Maksudnya, Allah membimbing dan menjaga anggota badan hamba tersebut sehingga digunakan dalam ketaatan.","en":"This hadith qudsi explains the status of Allah's devoted servants: believers who have taqwa. The path to closeness begins with fulfilling obligations and then increasing voluntary acts of worship. The statement that Allah becomes the servant's hearing and sight does not mean that Allah merges with creation. Rather, it indicates Allah's guidance and protection of the servant's faculties so they are used in obedience.","ar":"يُبَيِّنُ الْحَدِيثُ مَنْزِلَةَ أَوْلِيَاءِ اللَّهِ، وَأَنَّ طَرِيقَ الْوِلَايَةِ يَبْدَأُ بِأَدَاءِ الْفَرَائِضِ ثُمَّ بِالنَّوَافِلِ، وَمَعْنَى الْحَدِيثِ أَنَّ اللَّهَ يُوَفِّقُ عَبْدَهُ وَيَحْفَظُ جَوَارِحَهُ مِنَ الْمَعَاصِي."},"n":["Abu Hurairah"],"na":["أبو هريرة"],"hn":["رضي الله عنه"],"im":["bu"],"no":[6502],"g":"","s":"Shahih Al-Bukhari no. 6502","mk":"رواه البخاري برقم ٦٥٠٢."},{"i":39,"t":{"id":"Dimaafkannya Kesalahan dan Kelupaan","en":"Forgiveness for Mistakes and Forgetfulness","ar":"العفو عن الخطأ والنسيان"},"a":"عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ: «إِنَّ اللَّهَ تَجَاوَزَ لِي عَنْ أُمَّتِي الْخَطَأَ وَالنِّسْيَانَ وَمَا اسْتُكْرِهُوا عَلَيْهِ».","m":{"id":"Dari Ibnu Abbas رضي الله عنهما, bahwa Rasulullah ﷺ bersabda, “Sesungguhnya Allah memaafkan umatku karena kesalahan yang tidak disengaja, karena lupa, dan karena sesuatu yang mereka dipaksa untuk melakukannya.”","en":"Ibn Abbas رضي الله عنهما reported that the Messenger of Allah ﷺ said, “Indeed, Allah has pardoned my nation for mistakes, forgetfulness, and what they are compelled to do.”"},"e":{"id":"Hadits ini menunjukkan luasnya rahmat Allah terhadap umat Nabi Muhammad ﷺ. Kesalahan yang tidak disengaja, kelupaan, dan perbuatan di bawah paksaan memiliki hukum yang berbeda dari tindakan sengaja. Namun, hadits ini tidak berarti semua akibat hukum otomatis gugur dalam setiap keadaan. Rincian hukum dan tanggung jawab tetap perlu merujuk kepada dalil serta penjelasan para ulama.","en":"This hadith shows Allah's mercy towards the Ummah of the Prophet Muhammad ﷺ. Unintentional mistakes, forgetfulness, and actions performed under coercion differ from deliberate actions. However, it does not mean that every legal consequence is automatically removed in all circumstances. Specific rulings and responsibilities must still be understood through the evidence and explanations of scholars.","ar":"يَدُلُّ الْحَدِيثُ عَلَى رَحْمَةِ اللَّهِ بِهَذِهِ الْأُمَّةِ، وَأَنَّ الْخَطَأَ وَالنِّسْيَانَ وَالْإِكْرَاهَ لَهَا أَحْكَامٌ تَخْتَلِفُ عَنِ الْعَمْدِ، مَعَ مُرَاعَاةِ التَّفْصِيلَاتِ الْفِقْهِيَّةِ فِي الْأَحْكَامِ وَالْآثَارِ."},"n":["Abdullah bin Abbas"],"na":["عبد الله بن عباس"],"hn":["رضي الله عنهما"],"im":["ma","bh"],"no":[2045,0],"g":"h","s":"Sunan Ibnu Majah no. 2045; Al-Baihaqi, As-Sunan Al-Kubra. Dinilai hasan oleh Imam An-Nawawi.","mk":"رواه ابن ماجه برقم ٢٠٤٥ والبيهقي في السنن الكبرى، وحسّنه النووي."},{"i":40,"t":{"id":"Jadilah Seperti Orang Asing di Dunia","en":"Be Like a Stranger in This World","ar":"كن في الدنيا كأنك غريب"},"a":"عَنِ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: أَخَذَ رَسُولُ اللَّهِ ﷺ بِمَنْكِبِي فَقَالَ: «كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ». وَكَانَ ابْنُ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا يَقُولُ: «إِذَا أَمْسَيْتَ فَلَا تَنْتَظِرِ الصَّبَاحَ، وَإِذَا أَصْبَحْتَ فَلَا تَنْتَظِرِ الْمَسَاءَ، وَخُذْ مِنْ صِحَّتِكَ لِمَرَضِكَ، وَمِنْ حَيَاتِكَ لِمَوْتِكَ».","m":{"id":"Dari Ibnu Umar رضي الله عنهما, ia berkata, Rasulullah ﷺ memegang bahuku lalu bersabda, “Jadilah engkau di dunia seakan-akan orang asing atau seorang pengembara yang sedang melintas.” Ibnu Umar رضي الله عنهما juga berkata, “Jika engkau berada pada waktu sore, jangan menunggu datangnya pagi. Jika engkau berada pada waktu pagi, jangan menunggu datangnya sore. Manfaatkanlah kesehatanmu sebelum datang sakitmu dan kehidupanmu sebelum datang kematianmu.”","en":"Ibn Umar رضي الله عنهما reported: The Messenger of Allah ﷺ took hold of my shoulder and said, “Be in this world as though you are a stranger or a traveler passing through.” Ibn Umar رضي الله عنهما used to say, “When evening comes, do not expect to reach the morning, and when morning comes, do not expect to reach the evening. Make use of your health before illness comes, and your life before death comes.”"},"e":{"id":"Seorang Muslim hendaknya tidak menjadikan dunia sebagai tujuan akhir. Kehidupan dunia hanya sementara, sehingga waktu, kesehatan, dan kesempatan harus digunakan untuk ketaatan kepada Allah. Nasihat Ibnu Umar mengingatkan agar tidak menunda amal saleh karena tidak ada jaminan seseorang masih hidup pada hari berikutnya.","en":"A Muslim should not make worldly life their ultimate goal. This life is temporary, so time, health, and opportunities should be used in obedience to Allah. Ibn Umar's advice reminds us not to delay righteous deeds, since no one is guaranteed another day of life.","ar":"يُرْشِدُ الْحَدِيثُ إِلَى قِصَرِ الْأَمَلِ فِي الدُّنْيَا، وَاسْتِعْمَالِ الْوَقْتِ وَالصِّحَّةِ وَالْحَيَاةِ فِي طَاعَةِ اللَّهِ، وَعَدَمِ تَأْخِيرِ الْأَعْمَالِ الصَّالِحَةِ."},"n":["Abdullah bin Umar"],"na":["عبد الله بن عمر"],"hn":["رضي الله عنهما"],"im":["bu"],"no":[6416],"g":"","s":"Shahih Al-Bukhari no. 6416","mk":"رواه البخاري برقم ٦٤١٦."},{"i":41,"t":{"id":"Menundukkan Hawa Nafsu kepada Wahyu","en":"Submitting Desires to Revelation","ar":"اتباع الهوى لما جاء به الرسول"},"a":"عَنْ أَبِي مُحَمَّدٍ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ: «لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يَكُونَ هَوَاهُ تَبَعًا لِمَا جِئْتُ بِهِ».","m":{"id":"Dari Abu Muhammad Abdullah bin Amr bin Al-Ash رضي الله عنهما, ia berkata bahwa Rasulullah ﷺ bersabda, “Tidaklah sempurna iman salah seorang dari kalian hingga hawa nafsunya mengikuti ajaran yang aku bawa.”","en":"Abu Muhammad Abdullah ibn Amr ibn al-As رضي الله عنهما reported that the Messenger of Allah ﷺ said, “None of you truly believes until his desires follow what I have brought.”"},"e":{"id":"Hadits ini mengajarkan bahwa seorang Muslim harus menjadikan wahyu sebagai pedoman, bukan menjadikan keinginan pribadi sebagai ukuran benar dan salah. Ketika keinginan bertentangan dengan Al-Qur'an dan Sunnah yang sahih, seorang mukmin berusaha menundukkan keinginannya kepada petunjuk Allah dan Rasul-Nya.","en":"This hadith teaches that a Muslim must take revelation as the standard of truth rather than personal desire. When one's desires conflict with the Qur'an and authentic Sunnah, a believer strives to submit those desires to the guidance of Allah and His Messenger.","ar":"يَدُلُّ الْحَدِيثُ عَلَى وُجُوبِ تَحْكِيمِ الْوَحْيِ، وَأَنْ يَجْعَلَ الْمُسْلِمُ رَغَبَاتَهُ تَابِعَةً لِمَا جَاءَ بِهِ الرَّسُولُ ﷺ، لَا أَنْ يَجْعَلَ الْهَوَى حَاكِمًا عَلَى الشَّرْعِ."},"n":["Abdullah bin Amr bin Al-Ash"],"na":["عبد الله بن عمرو بن العاص"],"hn":["رضي الله عنهما"],"im":["nw"],"no":[0],"g":"hs","s":"Diriwayatkan oleh Imam An-Nawawi dalam Al-Arba'in dari Kitab Al-Hujjah. Dinilai hasan shahih oleh An-Nawawi; terdapat pembahasan tentang sanadnya di kalangan ahli hadits.","mk":"رواه النووي في الأربعين من كتاب الحجة، وقال: حديث حسن صحيح، وفي سنده كلام عند أهل الحديث."},{"i":42,"t":{"id":"Jangan Berputus Asa dari Ampunan Allah","en":"Never Despair of Allah's Forgiveness","ar":"سعة مغفرة الله تعالى"},"a":"عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ: قَالَ اللَّهُ تَبَارَكَ وَتَعَالَى: «يَا ابْنَ آدَمَ، إِنَّكَ مَا دَعَوْتَنِي وَرَجَوْتَنِي غَفَرْتُ لَكَ عَلَى مَا كَانَ مِنْكَ وَلَا أُبَالِي. يَا ابْنَ آدَمَ، لَوْ بَلَغَتْ ذُنُوبُكَ عَنَانَ السَّمَاءِ ثُمَّ اسْتَغْفَرْتَنِي غَفَرْتُ لَكَ. يَا ابْنَ آدَمَ، إِنَّكَ لَوْ أَتَيْتَنِي بِقُرَابِ الْأَرْضِ خَطَايَا ثُمَّ لَقِيتَنِي لَا تُشْرِكُ بِي شَيْئًا لَأَتَيْتُكَ بِقُرَابِهَا مَغْفِرَةً».","m":{"id":"Dari Anas bin Malik رضي الله عنه, ia berkata: Aku mendengar Rasulullah ﷺ bersabda bahwa Allah Tabaraka wa Ta'ala berfirman, “Wahai anak Adam, selama engkau berdoa kepada-Ku dan berharap kepada-Ku, Aku akan mengampunimu atas dosa-dosamu dan Aku tidak mempedulikannya. Wahai anak Adam, seandainya dosa-dosamu mencapai awan di langit, kemudian engkau memohon ampun kepada-Ku, Aku pasti mengampunimu. Wahai anak Adam, seandainya engkau datang kepada-Ku dengan membawa dosa sepenuh bumi, kemudian engkau menemui-Ku tanpa menyekutukan-Ku dengan sesuatu apa pun, Aku pasti akan datang kepadamu dengan ampunan sepenuh bumi pula.”","en":"Anas ibn Malik رضي الله عنه reported that he heard the Messenger of Allah ﷺ narrate that Allah, the Blessed and Exalted, said: “O son of Adam, as long as you call upon Me and hope in Me, I will forgive you for what you have done, and I do not mind. O son of Adam, if your sins were to reach the clouds of the sky and then you asked Me for forgiveness, I would forgive you. O son of Adam, if you were to come to Me with sins nearly as great as the earth, and then meet Me without associating anything with Me, I would bring you forgiveness nearly as great as it.”"},"e":{"id":"Hadits qudsi ini menjadi penutup Arba'in dengan penegasan tentang luasnya ampunan Allah. Seorang hamba diperintahkan untuk terus berdoa, berharap, bertobat, dan memohon ampun. Ampunan ini tidak boleh dijadikan alasan untuk meremehkan dosa atau sengaja terus bermaksiat. Tauhid, keikhlasan, dan tobat yang benar merupakan perkara yang sangat penting.","en":"This hadith qudsi concludes the Arba'in with a powerful reminder of the vastness of Allah's forgiveness. A servant should continue to pray, hope in Allah, repent, and seek forgiveness. This promise must never be used as an excuse to take sins lightly or deliberately persist in wrongdoing. Tawhid, sincerity, and genuine repentance remain essential.","ar":"يَخْتِمُ هَذَا الْحَدِيثُ الْأَرْبَعِينَ بِبَيَانِ سَعَةِ مَغْفِرَةِ اللَّهِ، وَيَحُثُّ الْعَبْدَ عَلَى الدُّعَاءِ وَالرَّجَاءِ وَالِاسْتِغْفَارِ وَالتَّوْبَةِ، مِنْ غَيْرِ اغْتِرَارٍ بِالْمَغْفِرَةِ أَوِ اسْتِهَانَةٍ بِالذُّنُوبِ."},"n":["Anas bin Malik"],"na":["أنس بن مالك"],"hn":["رضي الله عنه"],"im":["ti"],"no":[3540],"g":"hs","s":"Jami' At-Tirmidzi no. 3540; At-Tirmidzi menilainya hasan shahih.","mk":"رواه الترمذي برقم ٣٥٤٠، وقال: حسن صحيح."}];
const MT={"1":"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ فَهِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ، وَمَنْ كَانَتْ هِجْرَتُهُ لِدُنْيَا يُصِيبُهَا أَوِ امْرَأَةٍ يَنْكِحُهَا فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ.","2":"بَيْنَمَا نَحْنُ جُلُوسٌ عِنْدَ رَسُولِ اللَّهِ ﷺ ذَاتَ يَوْمٍ، إِذْ طَلَعَ عَلَيْنَا رَجُلٌ شَدِيدُ بَيَاضِ الثِّيَابِ، شَدِيدُ سَوَادِ الشَّعْرِ، لَا يُرَى عَلَيْهِ أَثَرُ السَّفَرِ، وَلَا يَعْرِفُهُ مِنَّا أَحَدٌ، حَتَّى جَلَسَ إِلَى النَّبِيِّ ﷺ فَأَسْنَدَ رُكْبَتَيْهِ إِلَى رُكْبَتَيْهِ، وَوَضَعَ كَفَّيْهِ عَلَى فَخِذَيْهِ، وَقَالَ: يَا مُحَمَّدُ أَخْبِرْنِي عَنِ الْإِسْلَامِ. فَقَالَ رَسُولُ اللَّهِ ﷺ: الْإِسْلَامُ أَنْ تَشْهَدَ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَتُقِيمَ الصَّلَاةَ، وَتُؤْتِيَ الزَّكَاةَ، وَتَصُومَ رَمَضَانَ، وَتَحُجَّ الْبَيْتَ إِنِ اسْتَطَعْتَ إِلَيْهِ سَبِيلًا. قَالَ: صَدَقْتَ. فَعَجِبْنَا لَهُ يَسْأَلُهُ وَيُصَدِّقُهُ! قَالَ: فَأَخْبِرْنِي عَنِ الْإِيمَانِ. قَالَ: أَنْ تُؤْمِنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ وَالْيَوْمِ الْآخِرِ، وَتُؤْمِنَ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ. قَالَ: صَدَقْتَ. قَالَ: فَأَخْبِرْنِي عَنِ الْإِحْسَانِ. قَالَ: أَنْ تَعْبُدَ اللَّهَ كَأَنَّكَ تَرَاهُ، فَإِنْ لَمْ تَكُنْ تَرَاهُ فَإِنَّهُ يَرَاكَ. قَالَ: فَأَخْبِرْنِي عَنِ السَّاعَةِ. قَالَ: مَا الْمَسْئُولُ عَنْهَا بِأَعْلَمَ مِنَ السَّائِلِ. قَالَ: فَأَخْبِرْنِي عَنْ أَمَارَاتِهَا. قَالَ: أَنْ تَلِدَ الْأَمَةُ رَبَّتَهَا، وَأَنْ تَرَى الْحُفَاةَ الْعُرَاةَ الْعَالَةَ رِعَاءَ الشَّاءِ يَتَطَاوَلُونَ فِي الْبُنْيَانِ. ثُمَّ انْطَلَقَ، فَلَبِثْتُ مَلِيًّا، ثُمَّ قَالَ: يَا عُمَرُ أَتَدْرِي مَنِ السَّائِلُ؟ قُلْتُ: اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ: فَإِنَّهُ جِبْرِيلُ أَتَاكُمْ يُعَلِّمُكُمْ دِينَكُمْ.","3":"بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَإِقَامِ الصَّلَاةِ، وَإِيتَاءِ الزَّكَاةِ، وَحَجِّ الْبَيْتِ، وَصَوْمِ رَمَضَانَ.","4":"إِنَّ أَحَدَكُمْ يُجْمَعُ خَلْقُهُ فِي بَطْنِ أُمِّهِ أَرْبَعِينَ يَوْمًا نُطْفَةً، ثُمَّ يَكُونُ عَلَقَةً مِثْلَ ذَلِكَ، ثُمَّ يَكُونُ مُضْغَةً مِثْلَ ذَلِكَ، ثُمَّ يُرْسَلُ إِلَيْهِ الْمَلَكُ فَيَنْفُخُ فِيهِ الرُّوحَ، وَيُؤْمَرُ بِأَرْبَعِ كَلِمَاتٍ: بِكَتْبِ رِزْقِهِ، وَأَجَلِهِ، وَعَمَلِهِ، وَشَقِيٌّ أَمْ سَعِيدٌ. فَوَاللَّهِ الَّذِي لَا إِلَهَ غَيْرُهُ إِنَّ أَحَدَكُمْ لَيَعْمَلُ بِعَمَلِ أَهْلِ الْجَنَّةِ حَتَّى مَا يَكُونُ بَيْنَهُ وَبَيْنَهَا إِلَّا ذِرَاعٌ، فَيَسْبِقُ عَلَيْهِ الْكِتَابُ فَيَعْمَلُ بِعَمَلِ أَهْلِ النَّارِ فَيَدْخُلُهَا، وَإِنَّ أَحَدَكُمْ لَيَعْمَلُ بِعَمَلِ أَهْلِ النَّارِ حَتَّى مَا يَكُونُ بَيْنَهُ وَبَيْنَهَا إِلَّا ذِرَاعٌ، فَيَسْبِقُ عَلَيْهِ الْكِتَابُ فَيَعْمَلُ بِعَمَلِ أَهْلِ الْجَنَّةِ فَيَدْخُلُهَا.","5":"مَنْ أَحْدَثَ فِي أَمْرِنَا هَذَا مَا لَيْسَ مِنْهُ فَهُوَ رَدٌّ. وَفِي رِوَايَةٍ لِمُسْلِمٍ: مَنْ عَمِلَ عَمَلًا لَيْسَ عَلَيْهِ أَمْرُنَا فَهُوَ رَدٌّ.","6":"إِنَّ الْحَلَالَ بَيِّنٌ وَإِنَّ الْحَرَامَ بَيِّنٌ، وَبَيْنَهُمَا أُمُورٌ مُشْتَبِهَاتٌ لَا يَعْلَمُهُنَّ كَثِيرٌ مِنَ النَّاسِ، فَمَنِ اتَّقَى الشُّبُهَاتِ اسْتَبْرَأَ لِدِينِهِ وَعِرْضِهِ، وَمَنْ وَقَعَ فِي الشُّبُهَاتِ وَقَعَ فِي الْحَرَامِ، كَالرَّاعِي يَرْعَى حَوْلَ الْحِمَى يُوشِكُ أَنْ يَرْتَعَ فِيهِ، أَلَا وَإِنَّ لِكُلِّ مَلِكٍ حِمًى، أَلَا وَإِنَّ حِمَى اللَّهِ مَحَارِمُهُ، أَلَا وَإِنَّ فِي الْجَسَدِ مُضْغَةً إِذَا صَلَحَتْ صَلَحَ الْجَسَدُ كُلُّهُ، وَإِذَا فَسَدَتْ فَسَدَ الْجَسَدُ كُلُّهُ، أَلَا وَهِيَ الْقَلْبُ.","7":"الدِّينُ النَّصِيحَةُ. قُلْنَا: لِمَنْ؟ قَالَ: لِلَّهِ، وَلِكِتَابِهِ، وَلِرَسُولِهِ، وَلِأَئِمَّةِ الْمُسْلِمِينَ وَعَامَّتِهِمْ.","8":"أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَشْهَدُوا أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَيُقِيمُوا الصَّلَاةَ، وَيُؤْتُوا الزَّكَاةَ، فَإِذَا فَعَلُوا ذَلِكَ عَصَمُوا مِنِّي دِمَاءَهُمْ وَأَمْوَالَهُمْ إِلَّا بِحَقِّ الْإِسْلَامِ، وَحِسَابُهُمْ عَلَى اللَّهِ تَعَالَى.","9":"مَا نَهَيْتُكُمْ عَنْهُ فَاجْتَنِبُوهُ، وَمَا أَمَرْتُكُمْ بِهِ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ، فَإِنَّمَا أَهْلَكَ الَّذِينَ مِنْ قَبْلِكُمْ كَثْرَةُ مَسَائِلِهِمْ وَاخْتِلَافُهُمْ عَلَى أَنْبِيَائِهِمْ.","10":"إِنَّ اللَّهَ تَعَالَى طَيِّبٌ لَا يَقْبَلُ إِلَّا طَيِّبًا، وَإِنَّ اللَّهَ أَمَرَ الْمُؤْمِنِينَ بِمَا أَمَرَ بِهِ الْمُرْسَلِينَ، فَقَالَ تَعَالَى: يَا أَيُّهَا الرُّسُلُ كُلُوا مِنَ الطَّيِّبَاتِ وَاعْمَلُوا صَالِحًا، وَقَالَ تَعَالَى: يَا أَيُّهَا الَّذِينَ آمَنُوا كُلُوا مِنْ طَيِّبَاتِ مَا رَزَقْنَاكُمْ. ثُمَّ ذَكَرَ الرَّجُلَ يُطِيلُ السَّفَرَ أَشْعَثَ أَغْبَرَ يَمُدُّ يَدَيْهِ إِلَى السَّمَاءِ: يَا رَبِّ يَا رَبِّ، وَمَطْعَمُهُ حَرَامٌ، وَمَشْرَبُهُ حَرَامٌ، وَمَلْبَسُهُ حَرَامٌ، وَغُذِيَ بِالْحَرَامِ، فَأَنَّى يُسْتَجَابُ لِذَلِكَ؟","11":"دَعْ مَا يُرِيبُكَ إِلَى مَا لَا يُرِيبُكَ.","12":"مِنْ حُسْنِ إِسْلَامِ الْمَرْءِ تَرْكُهُ مَا لَا يَعْنِيهِ.","13":"لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ.","14":"لَا يَحِلُّ دَمُ امْرِئٍ مُسْلِمٍ يَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنِّي رَسُولُ اللَّهِ إِلَّا بِإِحْدَى ثَلَاثٍ: الثَّيِّبُ الزَّانِي، وَالنَّفْسُ بِالنَّفْسِ، وَالتَّارِكُ لِدِينِهِ الْمُفَارِقُ لِلْجَمَاعَةِ.","15":"مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ جَارَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ ضَيْفَهُ.","16":"أَوْصِنِي. قَالَ: لَا تَغْضَبْ. فَرَدَّدَ مِرَارًا، قَالَ: لَا تَغْضَبْ.","17":"إِنَّ اللَّهَ كَتَبَ الْإِحْسَانَ عَلَى كُلِّ شَيْءٍ، فَإِذَا قَتَلْتُمْ فَأَحْسِنُوا الْقِتْلَةَ، وَإِذَا ذَبَحْتُمْ فَأَحْسِنُوا الذِّبْحَ، وَلْيُحِدَّ أَحَدُكُمْ شَفْرَتَهُ، وَلْيُرِحْ ذَبِيحَتَهُ.","18":"اتَّقِ اللَّهَ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا، وَخَالِقِ النَّاسَ بِخُلُقٍ حَسَنٍ.","19":"يَا غُلَامُ، إِنِّي أُعَلِّمُكَ كَلِمَاتٍ: احْفَظِ اللَّهَ يَحْفَظْكَ، احْفَظِ اللَّهَ تَجِدْهُ تُجَاهَكَ، إِذَا سَأَلْتَ فَاسْأَلِ اللَّهَ، وَإِذَا اسْتَعَنْتَ فَاسْتَعِنْ بِاللَّهِ، وَاعْلَمْ أَنَّ الْأُمَّةَ لَوِ اجْتَمَعَتْ عَلَى أَنْ يَنْفَعُوكَ بِشَيْءٍ لَمْ يَنْفَعُوكَ إِلَّا بِشَيْءٍ قَدْ كَتَبَهُ اللَّهُ لَكَ، وَإِنِ اجْتَمَعُوا عَلَى أَنْ يَضُرُّوكَ بِشَيْءٍ لَمْ يَضُرُّوكَ إِلَّا بِشَيْءٍ قَدْ كَتَبَهُ اللَّهُ عَلَيْكَ، رُفِعَتِ الْأَقْلَامُ وَجَفَّتِ الصُّحُفُ.","20":"إِنَّ مِمَّا أَدْرَكَ النَّاسُ مِنْ كَلَامِ النُّبُوَّةِ الْأُولَى: إِذَا لَمْ تَسْتَحِ فَاصْنَعْ مَا شِئْتَ.","21":"قُلْتُ: يَا رَسُولَ اللَّهِ، قُلْ لِي فِي الْإِسْلَامِ قَوْلًا لَا أَسْأَلُ عَنْهُ أَحَدًا غَيْرَكَ. قَالَ: قُلْ: آمَنْتُ بِاللَّهِ، ثُمَّ اسْتَقِمْ.","22":"أَنَّ رَجُلًا سَأَلَ رَسُولَ اللَّهِ ﷺ فَقَالَ: أَرَأَيْتَ إِذَا صَلَّيْتُ الْمَكْتُوبَاتِ، وَصُمْتُ رَمَضَانَ، وَأَحْلَلْتُ الْحَلَالَ، وَحَرَّمْتُ الْحَرَامَ، وَلَمْ أَزِدْ عَلَى ذَلِكَ شَيْئًا، أَأَدْخُلُ الْجَنَّةَ؟ قَالَ: نَعَمْ.","23":"الطُّهُورُ شَطْرُ الْإِيمَانِ، وَالْحَمْدُ لِلَّهِ تَمْلَأُ الْمِيزَانَ، وَسُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ تَمْلَآنِ - أَوْ تَمْلَأُ - مَا بَيْنَ السَّمَاءِ وَالْأَرْضِ، وَالصَّلَاةُ نُورٌ، وَالصَّدَقَةُ بُرْهَانٌ، وَالصَّبْرُ ضِيَاءٌ، وَالْقُرْآنُ حُجَّةٌ لَكَ أَوْ عَلَيْكَ، كُلُّ النَّاسِ يَغْدُو، فَبَائِعٌ نَفْسَهُ فَمُعْتِقُهَا أَوْ مُوبِقُهَا.","24":"يَا عِبَادِي، إِنِّي حَرَّمْتُ الظُّلْمَ عَلَى نَفْسِي، وَجَعَلْتُهُ بَيْنَكُمْ مُحَرَّمًا، فَلَا تَظَالَمُوا. يَا عِبَادِي، كُلُّكُمْ ضَالٌّ إِلَّا مَنْ هَدَيْتُهُ، فَاسْتَهْدُونِي أَهْدِكُمْ. يَا عِبَادِي، كُلُّكُمْ جَائِعٌ إِلَّا مَنْ أَطْعَمْتُهُ، فَاسْتَطْعِمُونِي أُطْعِمْكُمْ. يَا عِبَادِي، كُلُّكُمْ عَارٍ إِلَّا مَنْ كَسَوْتُهُ، فَاسْتَكْسُونِي أَكْسُكُمْ. يَا عِبَادِي، إِنَّكُمْ تُخْطِئُونَ بِاللَّيْلِ وَالنَّهَارِ، وَأَنَا أَغْفِرُ الذُّنُوبَ جَمِيعًا، فَاسْتَغْفِرُونِي أَغْفِرْ لَكُمْ. يَا عِبَادِي، إِنَّكُمْ لَنْ تَبْلُغُوا ضُرِّي فَتَضُرُّونِي، وَلَنْ تَبْلُغُوا نَفْعِي فَتَنْفَعُونِي. يَا عِبَادِي، لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ كَانُوا عَلَى أَتْقَى قَلْبِ رَجُلٍ وَاحِدٍ مِنْكُمْ، مَا زَادَ ذَلِكَ فِي مُلْكِي شَيْئًا. يَا عِبَادِي، لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ كَانُوا عَلَى أَفْجَرِ قَلْبِ رَجُلٍ وَاحِدٍ مِنْكُمْ، مَا نَقَصَ ذَلِكَ مِنْ مُلْكِي شَيْئًا. يَا عِبَادِي، لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ قَامُوا فِي صَعِيدٍ وَاحِدٍ فَسَأَلُونِي، فَأَعْطَيْتُ كُلَّ إِنْسَانٍ مَسْأَلَتَهُ، مَا نَقَصَ ذَلِكَ مِمَّا عِنْدِي إِلَّا كَمَا يَنْقُصُ الْمِخْيَطُ إِذَا أُدْخِلَ الْبَحْرَ. يَا عِبَادِي، إِنَّمَا هِيَ أَعْمَالُكُمْ أُحْصِيهَا لَكُمْ، ثُمَّ أُوَفِّيكُمْ إِيَّاهَا، فَمَنْ وَجَدَ خَيْرًا فَلْيَحْمَدِ اللَّهَ، وَمَنْ وَجَدَ غَيْرَ ذَلِكَ فَلَا يَلُومَنَّ إِلَّا نَفْسَهُ.","25":"أَنَّ نَاسًا مِنْ أَصْحَابِ رَسُولِ اللَّهِ ﷺ قَالُوا لِلنَّبِيِّ ﷺ: يَا رَسُولَ اللَّهِ، ذَهَبَ أَهْلُ الدُّثُورِ بِالْأُجُورِ، يُصَلُّونَ كَمَا نُصَلِّي، وَيَصُومُونَ كَمَا نَصُومُ، وَيَتَصَدَّقُونَ بِفُضُولِ أَمْوَالِهِمْ. قَالَ: أَوَلَيْسَ قَدْ جَعَلَ اللَّهُ لَكُمْ مَا تَصَدَّقُونَ؟ إِنَّ بِكُلِّ تَسْبِيحَةٍ صَدَقَةً، وَكُلِّ تَكْبِيرَةٍ صَدَقَةً، وَكُلِّ تَحْمِيدَةٍ صَدَقَةً، وَكُلِّ تَهْلِيلَةٍ صَدَقَةً، وَأَمْرٌ بِالْمَعْرُوفِ صَدَقَةٌ، وَنَهْيٌ عَنْ مُنْكَرٍ صَدَقَةٌ، وَفِي بُضْعِ أَحَدِكُمْ صَدَقَةٌ. قَالُوا: يَا رَسُولَ اللَّهِ، أَيَأْتِي أَحَدُنَا شَهْوَتَهُ وَيَكُونُ لَهُ فِيهَا أَجْرٌ؟ قَالَ: أَرَأَيْتُمْ لَوْ وَضَعَهَا فِي حَرَامٍ أَكَانَ عَلَيْهِ وِزْرٌ؟ فَكَذَلِكَ إِذَا وَضَعَهَا فِي الْحَلَالِ كَانَ لَهُ أَجْرٌ.","26":"كُلُّ سُلَامَى مِنَ النَّاسِ عَلَيْهِ صَدَقَةٌ، كُلَّ يَوْمٍ تَطْلُعُ فِيهِ الشَّمْسُ: تَعْدِلُ بَيْنَ اثْنَيْنِ صَدَقَةٌ، وَتُعِينُ الرَّجُلَ فِي دَابَّتِهِ فَتَحْمِلُهُ عَلَيْهَا، أَوْ تَرْفَعُ لَهُ عَلَيْهَا مَتَاعَهُ صَدَقَةٌ، وَالْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ، وَبِكُلِّ خُطْوَةٍ تَمْشِيهَا إِلَى الصَّلَاةِ صَدَقَةٌ، وَتُمِيطُ الْأَذَى عَنِ الطَّرِيقِ صَدَقَةٌ.","27":"الْبِرُّ حُسْنُ الْخُلُقِ، وَالْإِثْمُ مَا حَاكَ فِي صَدْرِكَ، وَكَرِهْتَ أَنْ يَطَّلِعَ عَلَيْهِ النَّاسُ.","28":"وَعَظَنَا رَسُولُ اللَّهِ ﷺ مَوْعِظَةً وَجِلَتْ مِنْهَا الْقُلُوبُ، وَذَرَفَتْ مِنْهَا الْعُيُونُ، فَقُلْنَا: يَا رَسُولَ اللَّهِ، كَأَنَّهَا مَوْعِظَةُ مُوَدِّعٍ فَأَوْصِنَا. قَالَ: أُوصِيكُمْ بِتَقْوَى اللَّهِ عَزَّ وَجَلَّ، وَالسَّمْعِ وَالطَّاعَةِ وَإِنْ تَأَمَّرَ عَلَيْكُمْ عَبْدٌ، فَإِنَّهُ مَنْ يَعِشْ مِنْكُمْ فَسَيَرَى اخْتِلَافًا كَثِيرًا، فَعَلَيْكُمْ بِسُنَّتِي وَسُنَّةِ الْخُلَفَاءِ الرَّاشِدِينَ الْمَهْدِيِّينَ، عَضُّوا عَلَيْهَا بِالنَّوَاجِذِ، وَإِيَّاكُمْ وَمُحْدَثَاتِ الْأُمُورِ، فَإِنَّ كُلَّ بِدْعَةٍ ضَلَالَةٌ.","29":"قُلْتُ: يَا رَسُولَ اللَّهِ، أَخْبِرْنِي بِعَمَلٍ يُدْخِلُنِي الْجَنَّةَ وَيُبَاعِدُنِي مِنَ النَّارِ. قَالَ: لَقَدْ سَأَلْتَ عَنْ عَظِيمٍ، وَإِنَّهُ لَيَسِيرٌ عَلَى مَنْ يَسَّرَهُ اللَّهُ عَلَيْهِ: تَعْبُدُ اللَّهَ لَا تُشْرِكُ بِهِ شَيْئًا، وَتُقِيمُ الصَّلَاةَ، وَتُؤْتِي الزَّكَاةَ، وَتَصُومُ رَمَضَانَ، وَتَحُجُّ الْبَيْتَ. ثُمَّ قَالَ: أَلَا أَدُلُّكَ عَلَى أَبْوَابِ الْخَيْرِ؟ الصَّوْمُ جُنَّةٌ، وَالصَّدَقَةُ تُطْفِئُ الْخَطِيئَةَ كَمَا يُطْفِئُ الْمَاءُ النَّارَ، وَصَلَاةُ الرَّجُلِ مِنْ جَوْفِ اللَّيْلِ. ثُمَّ تَلَا: ﴿تَتَجَافَىٰ جُنُوبُهُمْ عَنِ الْمَضَاجِعِ﴾ حَتَّى بَلَغَ ﴿يَعْمَلُونَ﴾. ثُمَّ قَالَ: أَلَا أُخْبِرُكَ بِرَأْسِ الْأَمْرِ وَعَمُودِهِ وَذِرْوَةِ سَنَامِهِ؟ قُلْتُ: بَلَى يَا رَسُولَ اللَّهِ. قَالَ: رَأْسُ الْأَمْرِ الْإِسْلَامُ، وَعَمُودُهُ الصَّلَاةُ، وَذِرْوَةُ سَنَامِهِ الْجِهَادُ. ثُمَّ قَالَ: أَلَا أُخْبِرُكَ بِمِلَاكِ ذَلِكَ كُلِّهِ؟ قُلْتُ: بَلَى يَا نَبِيَّ اللَّهِ. فَأَخَذَ بِلِسَانِهِ فَقَالَ: كُفَّ عَلَيْكَ هَذَا. قُلْتُ: يَا نَبِيَّ اللَّهِ، وَإِنَّا لَمُؤَاخَذُونَ بِمَا نَتَكَلَّمُ بِهِ؟ فَقَالَ: ثَكِلَتْكَ أُمُّكَ، وَهَلْ يَكُبُّ النَّاسَ فِي النَّارِ عَلَى وُجُوهِهِمْ - أَوْ قَالَ: عَلَى مَنَاخِرِهِمْ - إِلَّا حَصَائِدُ أَلْسِنَتِهِمْ؟.","30":"إِنَّ اللَّهَ تَعَالَى فَرَضَ فَرَائِضَ فَلَا تُضَيِّعُوهَا، وَحَدَّ حُدُودًا فَلَا تَعْتَدُوهَا، وَحَرَّمَ أَشْيَاءَ فَلَا تَنْتَهِكُوهَا، وَسَكَتَ عَنْ أَشْيَاءَ رَحْمَةً لَكُمْ غَيْرَ نِسْيَانٍ فَلَا تَبْحَثُوا عَنْهَا.","31":"جَاءَ رَجُلٌ إِلَى النَّبِيِّ ﷺ فَقَالَ: يَا رَسُولَ اللَّهِ، دُلَّنِي عَلَى عَمَلٍ إِذَا عَمِلْتُهُ أَحَبَّنِي اللَّهُ وَأَحَبَّنِي النَّاسُ. فَقَالَ: ازْهَدْ فِي الدُّنْيَا يُحِبَّكَ اللَّهُ، وَازْهَدْ فِيمَا عِنْدَ النَّاسِ يُحِبَّكَ النَّاسُ.","32":"لَا ضَرَرَ وَلَا ضِرَارَ.","33":"لَوْ يُعْطَى النَّاسُ بِدَعْوَاهُمْ، لَادَّعَى رِجَالٌ أَمْوَالَ قَوْمٍ وَدِمَاءَهُمْ، وَلَكِنَّ الْبَيِّنَةَ عَلَى الْمُدَّعِي، وَالْيَمِينَ عَلَى مَنْ أَنْكَرَ.","34":"مَنْ رَأَى مِنْكُمْ مُنْكَرًا فَلْيُغَيِّرْهُ بِيَدِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِلِسَانِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِقَلْبِهِ، وَذَلِكَ أَضْعَفُ الْإِيمَانِ.","35":"لَا تَحَاسَدُوا، وَلَا تَنَاجَشُوا، وَلَا تَبَاغَضُوا، وَلَا تَدَابَرُوا، وَلَا يَبِعْ بَعْضُكُمْ عَلَى بَيْعِ بَعْضٍ، وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا. الْمُسْلِمُ أَخُو الْمُسْلِمِ، لَا يَظْلِمُهُ، وَلَا يَخْذُلُهُ، وَلَا يَكْذِبُهُ، وَلَا يَحْقِرُهُ. التَّقْوَى هَاهُنَا - وَيُشِيرُ إِلَى صَدْرِهِ ثَلَاثَ مَرَّاتٍ - بِحَسْبِ امْرِئٍ مِنَ الشَّرِّ أَنْ يَحْقِرَ أَخَاهُ الْمُسْلِمَ. كُلُّ الْمُسْلِمِ عَلَى الْمُسْلِمِ حَرَامٌ: دَمُهُ وَمَالُهُ وَعِرْضُهُ.","36":"مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ، وَمَنْ يَسَّرَ عَلَى مُعْسِرٍ يَسَّرَ اللَّهُ عَلَيْهِ فِي الدُّنْيَا وَالْآخِرَةِ، وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ فِي الدُّنْيَا وَالْآخِرَةِ، وَاللَّهُ فِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ أَخِيهِ، وَمَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ، وَمَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللَّهِ يَتْلُونَ كِتَابَ اللَّهِ وَيَتَدَارَسُونَهُ فِيمَا بَيْنَهُمْ إِلَّا نَزَلَتْ عَلَيْهِمُ السَّكِينَةُ، وَغَشِيَتْهُمُ الرَّحْمَةُ، وَحَفَّتْهُمُ الْمَلَائِكَةُ، وَذَكَرَهُمُ اللَّهُ فِيمَنْ عِنْدَهُ، وَمَنْ أَبْطَأَ بِهِ عَمَلُهُ لَمْ يُسْرِعْ بِهِ نَسَبُهُ.","37":"إِنَّ اللَّهَ كَتَبَ الْحَسَنَاتِ وَالسَّيِّئَاتِ، ثُمَّ بَيَّنَ ذَلِكَ، فَمَنْ هَمَّ بِحَسَنَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللَّهُ عِنْدَهُ حَسَنَةً كَامِلَةً، وَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللَّهُ عِنْدَهُ عَشْرَ حَسَنَاتٍ إِلَى سَبْعِمِائَةِ ضِعْفٍ إِلَى أَضْعَافٍ كَثِيرَةٍ، وَإِنْ هَمَّ بِسَيِّئَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللَّهُ عِنْدَهُ حَسَنَةً كَامِلَةً، وَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللَّهُ سَيِّئَةً وَاحِدَةً.","38":"إِنَّ اللَّهَ تَعَالَى قَالَ: مَنْ عَادَى لِي وَلِيًّا فَقَدْ آذَنْتُهُ بِالْحَرْبِ، وَمَا تَقَرَّبَ إِلَيَّ عَبْدِي بِشَيْءٍ أَحَبَّ إِلَيَّ مِمَّا افْتَرَضْتُهُ عَلَيْهِ، وَلَا يَزَالُ عَبْدِي يَتَقَرَّبُ إِلَيَّ بِالنَّوَافِلِ حَتَّى أُحِبَّهُ، فَإِذَا أَحْبَبْتُهُ كُنْتُ سَمْعَهُ الَّذِي يَسْمَعُ بِهِ، وَبَصَرَهُ الَّذِي يُبْصِرُ بِهِ، وَيَدَهُ الَّتِي يَبْطِشُ بِهَا، وَرِجْلَهُ الَّتِي يَمْشِي بِهَا، وَإِنْ سَأَلَنِي لَأُعْطِيَنَّهُ، وَلَئِنِ اسْتَعَاذَنِي لَأُعِيذَنَّهُ.","39":"إِنَّ اللَّهَ تَجَاوَزَ لِي عَنْ أُمَّتِي الْخَطَأَ وَالنِّسْيَانَ وَمَا اسْتُكْرِهُوا عَلَيْهِ.","40":"كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ.","41":"لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يَكُونَ هَوَاهُ تَبَعًا لِمَا جِئْتُ بِهِ.","42":"يَا ابْنَ آدَمَ، إِنَّكَ مَا دَعَوْتَنِي وَرَجَوْتَنِي غَفَرْتُ لَكَ عَلَى مَا كَانَ مِنْكَ وَلَا أُبَالِي. يَا ابْنَ آدَمَ، لَوْ بَلَغَتْ ذُنُوبُكَ عَنَانَ السَّمَاءِ ثُمَّ اسْتَغْفَرْتَنِي غَفَرْتُ لَكَ. يَا ابْنَ آدَمَ، إِنَّكَ لَوْ أَتَيْتَنِي بِقُرَابِ الْأَرْضِ خَطَايَا ثُمَّ لَقِيتَنِي لَا تُشْرِكُ بِي شَيْئًا لَأَتَيْتُكَ بِقُرَابِهَا مَغْفِرَةً."};
