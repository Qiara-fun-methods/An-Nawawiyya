.cl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:10px}.cl b{font-size:12px;color:var(--mu)}.dy{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--s1);color:var(--mu)}.dy.gr{background:var(--mi);color:#0b3b30}.dy.re{background:var(--rd);color:#3d0b16}.dy.td{box-shadow:0 0 0 3px var(--pe)}.lgd{display:flex;gap:16px;justify-content:center;font-size:12px;margin-top:12px;color:var(--mu)}.lgd i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:middle;margin-inline-end:6px}.rb{flex:none}.ib.on{background:var(--mi);border-color:var(--mi);color:#0b3b30}.cd.rm{display:flex;align-items:center;gap:10px;border-color:var(--pe)}.rm .bt{width:auto;flex:none}#rt{width:auto;font-size:16px;padding:6px 10px}

const H=[{"i":1,"t":{"id":"Amal Bergantung pada Niat","en":"Actions Are Judged by Intentions","ar":"الأعمال بالنيات"},"a":"عَنْ أَمِيرِ الْمُؤْمِنِينَ أَبِي حَفْصٍ عُمَرَ بْنِ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ: إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ فَهِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ، وَمَنْ كَانَتْ هِجْرَتُهُ لِدُنْيَا يُصِيبُهَا أَوِ امْرَأَةٍ يَنْكِحُهَا فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ.","m":{"id":"Dari Amirul Mukminin Abu Hafsh Umar bin Al-Khaththab رضي الله عنه, beliau berkata: Aku mendengar Rasulullah ﷺ bersabda: Sesungguhnya amal-amal itu bergantung pada niatnya, dan setiap orang hanya mendapatkan sesuai dengan apa yang diniatkannya. Barang siapa hijrahnya karena Allah dan Rasul-Nya, maka hijrahnya kepada Allah dan Rasul-Nya. Barang siapa hijrahnya karena dunia yang ingin diperolehnya atau karena perempuan yang ingin dinikahinya, maka hijrahnya sesuai dengan tujuan hijrahnya.","en":"On the authority of Umar ibn al-Khattab, who said: I heard the Messenger of Allah ﷺ say: Actions are only by intentions, and every person will have only what they intended. Whoever migrates for Allah and His Messenger, their migration is for Allah and His Messenger. Whoever migrates for worldly gain or to marry a woman, their migration is for that which they migrated."},"e":{"id":"Niat merupakan dasar penilaian amal. Seorang muslim hendaknya mengikhlaskan tujuan ibadah dan amalnya hanya untuk Allah.","en":"Intention is the foundation by which actions are evaluated. A Muslim should make their worship and deeds sincerely for Allah.","ar":"النِّيَّةُ أَسَاسُ قَبُولِ الْأَعْمَالِ، وَيَنْبَغِي لِلْمُسْلِمِ أَنْ يُخْلِصَ عَمَلَهُ لِلَّهِ تَعَالَى."},"n":["Umar bin Al-Khaththab"],"na":["عمر بن الخطاب"],"hn":["رضي الله عنه"],"im":["bu","mu"],"no":[1,1907],"g":"","s":"HR. Al-Bukhari no. 1 dan Muslim no. 1907","mk":"رواه البخاري برقم ١ ومسلم برقم ١٩٠٧."},{"i":2,"t":{"id":"Islam, Iman, dan Ihsan","en":"Islam, Faith and Excellence","ar":"الإسلام والإيمان والإحسان"},"a":"عَنْ عُمَرَ بْنِ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ أَيْضًا قَالَ: بَيْنَمَا نَحْنُ جُلُوسٌ عِنْدَ رَسُولِ اللَّهِ ﷺ ذَاتَ يَوْمٍ، إِذْ طَلَعَ عَلَيْنَا رَجُلٌ شَدِيدُ بَيَاضِ الثِّيَابِ، شَدِيدُ سَوَادِ الشَّعْرِ، لَا يُرَى عَلَيْهِ أَثَرُ السَّفَرِ، وَلَا يَعْرِفُهُ مِنَّا أَحَدٌ، حَتَّى جَلَسَ إِلَى النَّبِيِّ ﷺ فَأَسْنَدَ رُكْبَتَيْهِ إِلَى رُكْبَتَيْهِ، وَوَضَعَ كَفَّيْهِ عَلَى فَخِذَيْهِ، وَقَالَ: يَا مُحَمَّدُ أَخْبِرْنِي عَنِ الْإِسْلَامِ. فَقَالَ رَسُولُ اللَّهِ ﷺ: الْإِسْلَامُ أَنْ تَشْهَدَ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَتُقِيمَ الصَّلَاةَ، وَتُؤْتِيَ الزَّكَاةَ، وَتَصُومَ رَمَضَانَ، وَتَحُجَّ الْبَيْتَ إِنِ اسْتَطَعْتَ إِلَيْهِ سَبِيلًا. قَالَ: صَدَقْتَ. فَعَجِبْنَا لَهُ يَسْأَلُهُ وَيُصَدِّقُهُ! قَالَ: فَأَخْبِرْنِي عَنِ الْإِيمَانِ. قَالَ: أَنْ تُؤْمِنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ وَالْيَوْمِ الْآخِرِ، وَتُؤْمِنَ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ. قَالَ: صَدَقْتَ. قَالَ: فَأَخْبِرْنِي عَنِ الْإِحْسَانِ. قَالَ: أَنْ تَعْبُدَ اللَّهَ كَأَنَّكَ تَرَاهُ، فَإِنْ لَمْ تَكُنْ تَرَاهُ فَإِنَّهُ يَرَاكَ. قَالَ: فَأَخْبِرْنِي عَنِ السَّاعَةِ. قَالَ: مَا الْمَسْئُولُ عَنْهَا بِأَعْلَمَ مِنَ السَّائِلِ. قَالَ: فَأَخْبِرْنِي عَنْ أَمَارَاتِهَا. قَالَ: أَنْ تَلِدَ الْأَمَةُ رَبَّتَهَا، وَأَنْ تَرَى الْحُفَاةَ الْعُرَاةَ الْعَالَةَ رِعَاءَ الشَّاءِ يَتَطَاوَلُونَ فِي الْبُنْيَانِ. ثُمَّ انْطَلَقَ، فَلَبِثْتُ مَلِيًّا، ثُمَّ قَالَ: يَا عُمَرُ أَتَدْرِي مَنِ السَّائِلُ؟ قُلْتُ: اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ: فَإِنَّهُ جِبْرِيلُ أَتَاكُمْ يُعَلِّمُكُمْ دِينَكُمْ.","m":{"id":"Dari Umar bin Al-Khaththab رضي الله عنه, beliau berkata: Ketika kami sedang duduk di sisi Rasulullah ﷺ, tiba-tiba datang seorang laki-laki dengan pakaian sangat putih dan rambut sangat hitam. Tidak terlihat padanya bekas perjalanan dan tidak seorang pun dari kami mengenalnya. Ia duduk di hadapan Nabi ﷺ, merapatkan kedua lututnya ke lutut Nabi dan meletakkan kedua telapak tangannya di atas paha beliau. Ia berkata: Wahai Muhammad, beritahukan kepadaku tentang Islam. Rasulullah ﷺ menjawab: Islam adalah engkau bersaksi bahwa tidak ada sesembahan yang berhak disembah selain Allah dan Muhammad adalah utusan Allah, mendirikan salat, menunaikan zakat, berpuasa Ramadan, dan berhaji ke Baitullah jika mampu. Ia berkata: Engkau benar. Kami heran, ia bertanya sekaligus membenarkan. Ia bertanya lagi tentang iman. Beliau menjawab: Engkau beriman kepada Allah, para malaikat-Nya, kitab-kitab-Nya, para rasul-Nya, hari akhir, dan takdir yang baik maupun buruk. Ia berkata: Engkau benar. Ia bertanya tentang ihsan. Beliau menjawab: Engkau beribadah kepada Allah seakan-akan melihat-Nya. Jika engkau tidak melihat-Nya, sesungguhnya Dia melihatmu. Ia bertanya tentang kiamat. Beliau menjawab: Yang ditanya tidak lebih mengetahui daripada yang bertanya. Ia bertanya tentang tanda-tandanya. Beliau menjawab: Seorang budak perempuan melahirkan tuannya, dan engkau melihat orang-orang yang tidak beralas kaki, tidak berpakaian memadai, miskin, penggembala kambing berlomba-lomba meninggikan bangunan. Kemudian orang itu pergi. Setelah beberapa waktu, Nabi bertanya: Wahai Umar, tahukah engkau siapa orang yang bertanya tadi? Aku menjawab: Allah dan Rasul-Nya lebih mengetahui. Beliau bersabda: Dia adalah Jibril, datang kepada kalian untuk mengajarkan agama kalian.","en":"On the authority of Umar ibn al-Khattab: One day, while we were sitting with the Messenger of Allah ﷺ, a man appeared before us with very white clothes and very black hair. No signs of travel could be seen on him, and none of us knew him. He sat before the Prophet, placed his knees against his knees and his hands on his thighs, and asked about Islam. The Prophet replied that Islam is to testify that none has the right to be worshipped except Allah and Muhammad is His Messenger, establish prayer, give zakah, fast Ramadan, and perform pilgrimage if able. The man said, 'You have spoken the truth.' He then asked about faith. The Prophet explained belief in Allah, His angels, His books, His messengers, the Last Day, and divine decree, both good and bad. The man again affirmed his answer. He asked about excellence in worship. The Prophet replied: To worship Allah as though you see Him, and if you do not see Him, He surely sees you. He asked about the Hour. The Prophet said that the one asked knows no more than the questioner. He asked about its signs. The Prophet mentioned that a slave woman would give birth to her mistress and that barefoot, poorly clothed and poor shepherds would compete in building tall structures. The man departed. Later, the Prophet told Umar that the man was Jibril, who had come to teach them their religion."},"e":{"id":"Hadits ini menjelaskan tiga tingkatan agama: Islam, iman, dan ihsan. Hadits ini juga menerangkan sebagian tanda kiamat serta menunjukkan bahwa Jibril datang mengajarkan agama kepada para sahabat.","en":"This hadith explains the three dimensions of religion: Islam, faith, and excellence in worship. It also mentions signs of the Hour and shows that Jibril came to teach the Companions their religion.","ar":"يُبَيِّنُ هَذَا الْحَدِيثُ مَرَاتِبَ الدِّينِ الثَّلَاثَ: الْإِسْلَامَ وَالْإِيمَانَ وَالْإِحْسَانَ، وَيَذْكُرُ بَعْضَ أَشْرَاطِ السَّاعَةِ."},"n":["Umar bin Al-Khaththab"],"na":["عمر بن الخطاب"],"hn":["رضي الله عنه"],"im":["mu"],"no":[8],"g":"","s":"HR. Muslim no. 8","mk":"رواه مسلم برقم ٨."},{"i":3,"t":{"id":"Rukun Islam","en":"The Pillars of Islam","ar":"أركان الإسلام"},"a":"عَنْ أَبِي عَبْدِ الرَّحْمَنِ عَبْدِ اللَّهِ بْنِ عُمَرَ بْنِ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ: بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَإِقَامِ الصَّلَاةِ، وَإِيتَاءِ الزَّكَاةِ، وَحَجِّ الْبَيْتِ، وَصَوْمِ رَمَضَانَ.","m":{"id":"Dari Abu Abdurrahman Abdullah bin Umar bin Al-Khaththab رضي الله عنهما, beliau berkata: Aku mendengar Rasulullah ﷺ bersabda: Islam dibangun di atas lima perkara: bersaksi bahwa tidak ada sesembahan yang berhak disembah selain Allah dan Muhammad adalah utusan Allah, mendirikan salat, menunaikan zakat, berhaji ke Baitullah, dan berpuasa Ramadan.","en":"On the authority of Abdullah ibn Umar: I heard the Messenger of Allah ﷺ say: Islam is built upon five: the testimony that none has the right to be worshipped except Allah and Muhammad is the Messenger of Allah, establishing prayer, giving zakah, pilgrimage to the House, and fasting Ramadan."},"e":{"id":"Lima rukun ini merupakan fondasi utama Islam. Seorang muslim wajib mempelajari dan menjaga pelaksanaan rukun-rukun tersebut sesuai tuntunan syariat.","en":"These five pillars are the foundations of Islam. A Muslim should learn them and uphold them according to the guidance of the religion.","ar":"هَذِهِ الْخَمْسَةُ أُصُولُ الْإِسْلَامِ، وَيَجِبُ عَلَى الْمُسْلِمِ تَعَلُّمُهَا وَالْعَمَلُ بِهَا."},"n":["Abdullah bin Umar"],"na":["عبد الله بن عمر"],"hn":["رضي الله عنهما"],"im":["bu","mu"],"no":[8,16],"g":"","s":"HR. Al-Bukhari no. 8 dan Muslim no. 16","mk":"رواه البخاري برقم ٨ ومسلم برقم ١٦."},{"i":4,"t":{"id":"Tahapan Penciptaan Manusia dan Akhir Kehidupan","en":"Human Creation and the Final Outcome","ar":"مراحل خلق الإنسان وخاتمة العمل"},"a":"عَنْ أَبِي عَبْدِ الرَّحْمَنِ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: حَدَّثَنَا رَسُولُ اللَّهِ ﷺ وَهُوَ الصَّادِقُ الْمَصْدُوقُ: إِنَّ أَحَدَكُمْ يُجْمَعُ خَلْقُهُ فِي بَطْنِ أُمِّهِ أَرْبَعِينَ يَوْمًا نُطْفَةً، ثُمَّ يَكُونُ عَلَقَةً مِثْلَ ذَلِكَ، ثُمَّ يَكُونُ مُضْغَةً مِثْلَ ذَلِكَ، ثُمَّ يُرْسَلُ إِلَيْهِ الْمَلَكُ فَيَنْفُخُ فِيهِ الرُّوحَ، وَيُؤْمَرُ بِأَرْبَعِ كَلِمَاتٍ: بِكَتْبِ رِزْقِهِ، وَأَجَلِهِ، وَعَمَلِهِ، وَشَقِيٌّ أَمْ سَعِيدٌ. فَوَاللَّهِ الَّذِي لَا إِلَهَ غَيْرُهُ إِنَّ أَحَدَكُمْ لَيَعْمَلُ بِعَمَلِ أَهْلِ الْجَنَّةِ حَتَّى مَا يَكُونُ بَيْنَهُ وَبَيْنَهَا إِلَّا ذِرَاعٌ، فَيَسْبِقُ عَلَيْهِ الْكِتَابُ فَيَعْمَلُ بِعَمَلِ أَهْلِ النَّارِ فَيَدْخُلُهَا، وَإِنَّ أَحَدَكُمْ لَيَعْمَلُ بِعَمَلِ أَهْلِ النَّارِ حَتَّى مَا يَكُونُ بَيْنَهُ وَبَيْنَهَا إِلَّا ذِرَاعٌ، فَيَسْبِقُ عَلَيْهِ الْكِتَابُ فَيَعْمَلُ بِعَمَلِ أَهْلِ الْجَنَّةِ فَيَدْخُلُهَا.","m":{"id":"Dari Abu Abdurrahman Abdullah bin Mas'ud رضي الله عنه, beliau berkata: Rasulullah ﷺ, yang selalu benar dan dibenarkan, menyampaikan kepada kami: Sesungguhnya penciptaan salah seorang dari kalian dikumpulkan dalam rahim ibunya selama empat puluh hari sebagai nutfah, kemudian menjadi 'alaqah selama masa yang sama, kemudian menjadi mudhghah selama masa yang sama. Setelah itu diutus malaikat kepadanya lalu ditiupkan ruh. Malaikat diperintahkan menulis empat perkara: rezekinya, ajalnya, amalnya, dan apakah ia termasuk orang yang celaka atau bahagia. Demi Allah yang tidak ada sesembahan selain Dia, sungguh seseorang di antara kalian melakukan amalan penghuni surga hingga jarak antara dirinya dan surga tinggal sehasta, tetapi ketetapan mendahuluinya lalu ia melakukan amalan penghuni neraka dan masuk ke dalamnya. Sungguh seseorang melakukan amalan penghuni neraka hingga jarak antara dirinya dan neraka tinggal sehasta, tetapi ketetapan mendahuluinya lalu ia melakukan amalan penghuni surga dan masuk ke dalamnya.","en":"On the authority of Abdullah ibn Mas'ud: The Messenger of Allah ﷺ, the truthful and the one whose truth was affirmed, told us: The creation of each of you is gathered in the womb of his mother for forty days as a drop, then becomes a clinging substance for a similar period, then a lump of flesh for a similar period. Then an angel is sent and the soul is breathed into him. The angel is commanded to record four matters: his provision, lifespan, deeds, and whether he will be wretched or blessed. By Allah, besides whom there is no deity, one of you may perform the deeds of the people of Paradise until only an arm's length remains between him and it, but the decree overtakes him and he performs the deeds of the people of Hell and enters it. Another may perform the deeds of the people of Hell until only an arm's length remains between him and it, but the decree overtakes him and he performs the deeds of the people of Paradise and enters it."},"e":{"id":"Hadits ini menjelaskan tahapan penciptaan manusia, penulisan takdir, dan pentingnya memohon keteguhan serta menjaga akhir kehidupan. Seseorang tidak boleh merasa aman dari perubahan keadaan amalnya.","en":"This hadith describes stages of human creation, the recording of divine decree, and the importance of seeking steadfastness and caring about one's final state. A person should not feel secure about their deeds without asking Allah for firmness.","ar":"يُبَيِّنُ الْحَدِيثُ مَرَاحِلَ خَلْقِ الْإِنْسَانِ وَكِتَابَةَ الْقَدَرِ، وَيُرَغِّبُ فِي سُؤَالِ اللَّهِ الثَّبَاتَ وَحُسْنَ الْخَاتِمَةِ."},"n":["Abdullah bin Mas'ud"],"na":["عبد الله بن مسعود"],"hn":["رضي الله عنه"],"im":["bu","mu"],"no":[3208,2643],"g":"","s":"HR. Al-Bukhari no. 3208 dan Muslim no. 2643","mk":"رواه البخاري برقم ٣٢٠٨ ومسلم برقم ٢٦٤٣."},{"i":5,"t":{"id":"Larangan Mengada-adakan dalam Agama","en":"Rejecting Religious Innovations","ar":"النهي عن الإحداث في الدين"},"a":"عَنْ أُمِّ الْمُؤْمِنِينَ أُمِّ عَبْدِ اللَّهِ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا قَالَتْ: قَالَ رَسُولُ اللَّهِ ﷺ: مَنْ أَحْدَثَ فِي أَمْرِنَا هَذَا مَا لَيْسَ مِنْهُ فَهُوَ رَدٌّ. وَفِي رِوَايَةٍ لِمُسْلِمٍ: مَنْ عَمِلَ عَمَلًا لَيْسَ عَلَيْهِ أَمْرُنَا فَهُوَ رَدٌّ.","m":{"id":"Dari Ummul Mukminin Ummu Abdillah Aisyah رضي الله عنها, beliau berkata: Rasulullah ﷺ bersabda: Barang siapa mengada-adakan perkara baru dalam urusan agama kami ini yang bukan bagian darinya, maka perkara itu tertolak. Dalam riwayat Muslim: Barang siapa melakukan suatu amalan yang tidak berdasarkan tuntunan kami, maka amalan itu tertolak.","en":"On the authority of the Mother of the Believers, Aishah: The Messenger of Allah ﷺ said: Whoever introduces into this matter of ours something that does not belong to it, it will be rejected. In another narration in Muslim: Whoever performs an action that is not in accordance with our guidance, it will be rejected."},"e":{"id":"Hadits ini menjadi kaidah bahwa ibadah dan perkara agama harus berdasarkan tuntunan Rasulullah ﷺ. Amalan yang tidak memiliki dasar dalam agama tidak diterima sebagai bagian dari syariat.","en":"This hadith establishes that acts of worship and religious practices must be based on the guidance of the Messenger of Allah ﷺ. An act without a valid basis in the religion is not accepted as part of the Sharia.","ar":"يُقَرِّرُ الْحَدِيثُ أَنَّ الْعِبَادَاتِ وَأُمُورَ الدِّينِ لَا بُدَّ أَنْ تَكُونَ وَفْقَ هَدْيِ رَسُولِ اللَّهِ ﷺ."},"n":["Aisyah"],"na":["عائشة"],"hn":["رضي الله عنها"],"im":["bu","mu"],"no":[2697,1718],"g":"","s":"HR. Al-Bukhari no. 2697 dan Muslim no. 1718","mk":"رواه البخاري برقم ٢٦٩٧ ومسلم برقم ١٧١٨."},{"i":6,"t":{"id":"Halal, Haram, dan Perkara Syubhat","en":"Halal, Haram and Doubtful Matters","ar":"الحلال والحرام والشبهات"},"a":"عَنْ أَبِي عَبْدِ اللَّهِ النُّعْمَانِ بْنِ بَشِيرٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ: إِنَّ الْحَلَالَ بَيِّنٌ وَإِنَّ الْحَرَامَ بَيِّنٌ، وَبَيْنَهُمَا أُمُورٌ مُشْتَبِهَاتٌ لَا يَعْلَمُهُنَّ كَثِيرٌ مِنَ النَّاسِ، فَمَنِ اتَّقَى الشُّبُهَاتِ اسْتَبْرَأَ لِدِينِهِ وَعِرْضِهِ، وَمَنْ وَقَعَ فِي الشُّبُهَاتِ وَقَعَ فِي الْحَرَامِ، كَالرَّاعِي يَرْعَى حَوْلَ الْحِمَى يُوشِكُ أَنْ يَرْتَعَ فِيهِ، أَلَا وَإِنَّ لِكُلِّ مَلِكٍ حِمًى، أَلَا وَإِنَّ حِمَى اللَّهِ مَحَارِمُهُ، أَلَا وَإِنَّ فِي الْجَسَدِ مُضْغَةً إِذَا صَلَحَتْ صَلَحَ الْجَسَدُ كُلُّهُ، وَإِذَا فَسَدَتْ فَسَدَ الْجَسَدُ كُلُّهُ، أَلَا وَهِيَ الْقَلْبُ.","m":{"id":"Dari Abu Abdillah An-Nu'man bin Basyir رضي الله عنهما, ia berkata: Aku mendengar Rasulullah ﷺ bersabda: Sesungguhnya yang halal itu jelas dan yang haram itu jelas. Di antara keduanya terdapat perkara-perkara samar yang tidak diketahui oleh banyak orang. Barang siapa menjaga diri dari perkara syubhat, ia telah menjaga agama dan kehormatannya. Barang siapa terjatuh dalam perkara syubhat, ia akan terjatuh dalam perkara haram, seperti penggembala yang menggembala di sekitar kawasan terlarang, hampir saja ia masuk ke dalamnya. Ketahuilah, setiap raja memiliki kawasan terlarang. Ketahuilah, kawasan terlarang Allah adalah perkara-perkara yang diharamkan-Nya. Ketahuilah, dalam tubuh terdapat segumpal daging; jika baik, seluruh tubuh menjadi baik, dan jika rusak, seluruh tubuh menjadi rusak. Ketahuilah, itulah hati.","en":"On the authority of An-Nu'man ibn Bashir: I heard the Messenger of Allah ﷺ say: The lawful is clear and the unlawful is clear, and between them are doubtful matters unknown to many people. Whoever avoids doubtful matters safeguards his religion and honor. Whoever falls into doubtful matters falls into the unlawful, like a shepherd grazing near a protected boundary and almost entering it. Every king has a protected boundary, and Allah's boundary is what He has forbidden. There is a piece of flesh in the body which, if sound, makes the whole body sound, and if corrupt, makes the whole body corrupt. It is the heart."},"e":{"id":"Seorang muslim hendaknya menjauhi perkara syubhat agar agamanya terjaga. Hadits ini juga menunjukkan pentingnya menjaga hati karena keadaan hati memengaruhi seluruh anggota tubuh.","en":"A Muslim should avoid doubtful matters to safeguard their religion. This hadith also emphasizes the heart, whose condition affects the whole body.","ar":"يَدُلُّ الْحَدِيثُ عَلَى اجْتِنَابِ الشُّبُهَاتِ وَأَهَمِّيَّةِ صَلَاحِ الْقَلْبِ."},"n":["An-Nu'man bin Basyir"],"na":["النعمان بن بشير"],"hn":["رضي الله عنهما"],"im":["bu","mu"],"no":[52,1599],"g":"","s":"HR. Al-Bukhari no. 52 dan Muslim no. 1599","mk":"رواه البخاري برقم ٥٢ ومسلم برقم ١٥٩٩."},{"i":7,"t":{"id":"Agama adalah Nasihat","en":"Religion Is Sincere Advice","ar":"الدين النصيحة"},"a":"عَنْ أَبِي رُقَيَّةَ تَمِيمِ بْنِ أَوْسٍ الدَّارِيِّ رَضِيَ اللَّهُ عَنْهُ أَنَّ النَّبِيَّ ﷺ قَالَ: الدِّينُ النَّصِيحَةُ. قُلْنَا: لِمَنْ؟ قَالَ: لِلَّهِ، وَلِكِتَابِهِ، وَلِرَسُولِهِ، وَلِأَئِمَّةِ الْمُسْلِمِينَ وَعَامَّتِهِمْ.","m":{"id":"Dari Abu Ruqayyah Tamim bin Aus Ad-Dari رضي الله عنه, bahwa Nabi ﷺ bersabda: Agama adalah nasihat. Kami bertanya: Untuk siapa? Beliau menjawab: Untuk Allah, kitab-Nya, Rasul-Nya, para pemimpin kaum muslimin, dan seluruh kaum muslimin.","en":"On the authority of Tamim ibn Aws Ad-Dari: The Prophet ﷺ said: Religion is sincere advice. We asked: To whom? He replied: To Allah, His Book, His Messenger, the leaders of the Muslims and their common people."},"e":{"id":"Nasihat dalam agama mencakup keikhlasan dalam beribadah kepada Allah, mengimani kitab-Nya, mengikuti Rasul-Nya, serta menginginkan kebaikan bagi kaum muslimin.","en":"Sincere advice includes worshipping Allah sincerely, believing in His Book, following His Messenger and wishing good for the Muslim community.","ar":"النَّصِيحَةُ تَشْمَلُ الْإِخْلَاصَ لِلَّهِ وَاتِّبَاعَ رَسُولِهِ وَإِرَادَةَ الْخَيْرِ لِلْمُسْلِمِينَ."},"n":["Tamim Ad-Dari"],"na":["تميم الداري"],"hn":["رضي الله عنه"],"im":["mu"],"no":[55],"g":"","s":"HR. Muslim no. 55","mk":"رواه مسلم برقم ٥٥."},{"i":8,"t":{"id":"Menjaga Darah dan Harta dengan Islam","en":"Protection of Life and Property Through Islam","ar":"عصمة الدم والمال بالإسلام"},"a":"عَنْ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ: أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَشْهَدُوا أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَيُقِيمُوا الصَّلَاةَ، وَيُؤْتُوا الزَّكَاةَ، فَإِذَا فَعَلُوا ذَلِكَ عَصَمُوا مِنِّي دِمَاءَهُمْ وَأَمْوَالَهُمْ إِلَّا بِحَقِّ الْإِسْلَامِ، وَحِسَابُهُمْ عَلَى اللَّهِ تَعَالَى.","m":{"id":"Dari Ibnu Umar رضي الله عنهما, bahwa Rasulullah ﷺ bersabda: Aku diperintahkan untuk memerangi manusia sampai mereka bersaksi bahwa tidak ada sesembahan yang berhak disembah selain Allah dan Muhammad adalah utusan Allah, mendirikan salat, dan menunaikan zakat. Jika mereka telah melakukan itu, mereka telah melindungi darah dan harta mereka dariku, kecuali dengan hak Islam. Adapun perhitungan mereka diserahkan kepada Allah Ta'ala.","en":"On the authority of Ibn Umar: The Messenger of Allah ﷺ said: I have been commanded to fight the people until they testify that none has the right to be worshipped except Allah and that Muhammad is the Messenger of Allah, establish prayer and give zakah. If they do so, their lives and property are protected from me, except by the right of Islam, and their reckoning is with Allah."},"e":{"id":"Hadits ini menerangkan kedudukan syahadat, salat, dan zakat serta perlindungan jiwa dan harta dalam hukum Islam. Pembahasan hukum dan penerapannya harus dikembalikan kepada penjelasan ulama dan ketentuan syariat, bukan tindakan pribadi.","en":"This hadith explains the significance of the testimony of faith, prayer and zakah, as well as the protection of life and property in Islamic law. Its legal application must be understood through scholarly explanation and Islamic legal principles, not personal action.","ar":"يُبَيِّنُ الْحَدِيثُ مَكَانَةَ الشَّهَادَتَيْنِ وَالصَّلَاةِ وَالزَّكَاةِ وَحِفْظَ الدِّمَاءِ وَالْأَمْوَالِ، وَيُرْجَعُ فِي فَهْمِ أَحْكَامِهِ إِلَى أَهْلِ الْعِلْمِ."},"n":["Abdullah bin Umar"],"na":["عبد الله بن عمر"],"hn":["رضي الله عنهما"],"im":["bu","mu"],"no":[25,22],"g":"","s":"HR. Al-Bukhari no. 25 dan Muslim no. 22","mk":"رواه البخاري برقم ٢٥ ومسلم برقم ٢٢."},{"i":9,"t":{"id":"Melaksanakan Perintah Sesuai Kemampuan","en":"Following Commands According to Ability","ar":"امتثال الأوامر حسب الاستطاعة"},"a":"عَنْ أَبِي هُرَيْرَةَ عَبْدِ الرَّحْمَنِ بْنِ صَخْرٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ: مَا نَهَيْتُكُمْ عَنْهُ فَاجْتَنِبُوهُ، وَمَا أَمَرْتُكُمْ بِهِ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ، فَإِنَّمَا أَهْلَكَ الَّذِينَ مِنْ قَبْلِكُمْ كَثْرَةُ مَسَائِلِهِمْ وَاخْتِلَافُهُمْ عَلَى أَنْبِيَائِهِمْ.","m":{"id":"Dari Abu Hurairah Abdurrahman bin Shakhr رضي الله عنه, ia berkata: Aku mendengar Rasulullah ﷺ bersabda: Apa yang aku larang bagi kalian, maka jauhilah. Apa yang aku perintahkan kepada kalian, maka lakukanlah semampu kalian. Sesungguhnya yang membinasakan orang-orang sebelum kalian adalah banyaknya pertanyaan mereka dan perselisihan mereka terhadap nabi-nabi mereka.","en":"On the authority of Abu Hurairah: I heard the Messenger of Allah ﷺ say: Whatever I have forbidden you, avoid it; and whatever I have commanded you, do as much of it as you are able. Those before you were destroyed by excessive questioning and their disagreement with their prophets."},"e":{"id":"Larangan wajib dijauhi, sedangkan perintah dilaksanakan sesuai kemampuan. Hadits ini juga memperingatkan agar tidak berlebihan dalam bertanya hingga menimbulkan kesulitan dan perselisihan.","en":"Prohibitions must be avoided, while commands are fulfilled according to one's ability. The hadith also warns against excessive questioning that leads to hardship and disputes.","ar":"يَجِبُ اجْتِنَابُ النَّوَاهِي وَفِعْلُ الْأَوَامِرِ حَسَبَ الِاسْتِطَاعَةِ، مَعَ تَرْكِ التَّكَلُّفِ وَالْجَدَلِ."},"n":["Abu Hurairah"],"na":["أبو هريرة"],"hn":["رضي الله عنه"],"im":["bu","mu"],"no":[7288,1337],"g":"","s":"HR. Al-Bukhari no. 7288 dan Muslim no. 1337","mk":"رواه البخاري برقم ٧٢٨٨ ومسلم برقم ١٣٣٧."},{"i":10,"t":{"id":"Allah Maha Baik dan Hanya Menerima yang Baik","en":"Allah Is Good and Accepts Only What Is Good","ar":"إن الله طيب لا يقبل إلا طيبا"},"a":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ: إِنَّ اللَّهَ تَعَالَى طَيِّبٌ لَا يَقْبَلُ إِلَّا طَيِّبًا، وَإِنَّ اللَّهَ أَمَرَ الْمُؤْمِنِينَ بِمَا أَمَرَ بِهِ الْمُرْسَلِينَ، فَقَالَ تَعَالَى: يَا أَيُّهَا الرُّسُلُ كُلُوا مِنَ الطَّيِّبَاتِ وَاعْمَلُوا صَالِحًا، وَقَالَ تَعَالَى: يَا أَيُّهَا الَّذِينَ آمَنُوا كُلُوا مِنْ طَيِّبَاتِ مَا رَزَقْنَاكُمْ. ثُمَّ ذَكَرَ الرَّجُلَ يُطِيلُ السَّفَرَ أَشْعَثَ أَغْبَرَ يَمُدُّ يَدَيْهِ إِلَى السَّمَاءِ: يَا رَبِّ يَا رَبِّ، وَمَطْعَمُهُ حَرَامٌ، وَمَشْرَبُهُ حَرَامٌ، وَمَلْبَسُهُ حَرَامٌ، وَغُذِيَ بِالْحَرَامِ، فَأَنَّى يُسْتَجَابُ لِذَلِكَ؟","m":{"id":"Dari Abu Hurairah رضي الله عنه, ia berkata: Rasulullah ﷺ bersabda: Sesungguhnya Allah Ta'ala Mahabaik dan tidak menerima kecuali yang baik. Sesungguhnya Allah memerintahkan kaum mukminin sebagaimana Dia memerintahkan para rasul. Allah berfirman: Wahai para rasul, makanlah dari makanan yang baik dan beramal salehlah. Allah juga berfirman: Wahai orang-orang yang beriman, makanlah dari rezeki yang baik yang Kami berikan kepada kalian. Kemudian beliau menyebutkan seorang laki-laki yang menempuh perjalanan jauh, rambutnya kusut dan berdebu, lalu mengangkat kedua tangannya ke langit seraya berdoa: Wahai Rabbku, wahai Rabbku. Padahal makanannya haram, minumannya haram, pakaiannya haram, dan ia diberi makan dari yang haram. Maka bagaimana doanya akan dikabulkan?","en":"On the authority of Abu Hurairah: The Messenger of Allah ﷺ said: Allah is Good and accepts only what is good. Allah has commanded the believers with what He commanded the messengers. He said: O messengers, eat from the good things and do righteous deeds. And He said: O you who believe, eat from the good things We have provided for you. Then he mentioned a man who travels far, disheveled and dusty, raising his hands to the sky and saying, 'My Lord, my Lord,' while his food, drink and clothing are unlawful and he has been nourished with the unlawful. How then can his supplication be answered?"},"e":{"id":"Hadits ini mengajarkan pentingnya mencari rezeki halal dan mengonsumsi yang baik. Perkara haram menjadi sebab terhalangnya terkabulnya doa.","en":"This hadith teaches the importance of lawful provision and wholesome consumption. Unlawful earnings and food can be among the reasons a supplication is not answered.","ar":"يَدُلُّ الْحَدِيثُ عَلَى أَهَمِّيَّةِ الْكَسْبِ الْحَلَالِ وَالطَّعَامِ الطَّيِّبِ، وَأَنَّ الْحَرَامَ مِنْ أَسْبَابِ مَنْعِ إِجَابَةِ الدُّعَاءِ."},"n":["Abu Hurairah"],"na":["أبو هريرة"],"hn":["رضي الله عنه"],"im":["mu"],"no":[1015],"g":"","s":"HR. Muslim no. 1015","mk":"رواه مسلم برقم ١٠١٥."},{"i":11,"t":{"id":"Tinggalkan Perkara yang Meragukan","en":"Leave What Makes You Doubt","ar":"دع ما يريبك"},"a":"عَنْ أَبِي مُحَمَّدٍ الْحَسَنِ بْنِ عَلِيِّ بْنِ أَبِي طَالِبٍ سِبْطِ رَسُولِ اللَّهِ ﷺ وَرَيْحَانَتِهِ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: حَفِظْتُ مِنْ رَسُولِ اللَّهِ ﷺ: دَعْ مَا يُرِيبُكَ إِلَى مَا لَا يُرِيبُكَ.","m":{"id":"Dari Abu Muhammad Al-Hasan bin Ali bin Abi Thalib, cucu Rasulullah ﷺ dan kesayangan beliau رضي الله عنهما, ia berkata: Aku menghafal dari Rasulullah ﷺ: Tinggalkanlah apa yang meragukanmu menuju apa yang tidak meragukanmu.","en":"On the authority of Abu Muhammad Al-Hasan ibn Ali ibn Abi Talib, the grandson and beloved of the Messenger of Allah ﷺ: I memorized from the Messenger of Allah ﷺ: Leave what makes you doubt for what does not make you doubt."},"e":{"id":"Hadits ini mengajarkan sikap wara', yaitu berhati-hati terhadap perkara yang meragukan dan memilih perkara yang jelas kebaikannya.","en":"This hadith teaches wara', or cautious piety: avoiding doubtful matters and choosing what is clear and sound.","ar":"يُعَلِّمُنَا الْحَدِيثُ الْوَرَعَ وَتَرْكَ الْأُمُورِ الْمُشْتَبِهَةِ إِلَى مَا هُوَ وَاضِحٌ."},"n":["Al-Hasan bin Ali"],"na":["الحسن بن علي"],"hn":["رضي الله عنهما"],"im":["ti","na"],"no":[2520,5711],"g":"hs","s":"HR. At-Tirmidzi no. 2520 dan An-Nasa'i no. 5711. At-Tirmidzi menilainya hasan shahih.","mk":"رواه الترمذي برقم ٢٥٢٠ والنسائي برقم ٥٧١١، وقال الترمذي: حسن صحيح."},{"i":12,"t":{"id":"Meninggalkan Hal yang Tidak Bermanfaat","en":"Leaving What Does Not Concern You","ar":"ترك ما لا يعني"},"a":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ: مِنْ حُسْنِ إِسْلَامِ الْمَرْءِ تَرْكُهُ مَا لَا يَعْنِيهِ.","m":{"id":"Dari Abu Hurairah رضي الله عنه, ia berkata: Rasulullah ﷺ bersabda: Di antara tanda baiknya keislaman seseorang adalah ia meninggalkan perkara yang tidak bermanfaat baginya.","en":"On the authority of Abu Hurairah: The Messenger of Allah ﷺ said: Part of the excellence of a person's Islam is leaving what does not concern or benefit them."},"e":{"id":"Seorang muslim hendaknya menggunakan waktu dan perhatiannya untuk hal yang bermanfaat, serta tidak sibuk mencampuri urusan yang bukan menjadi kepentingannya.","en":"A Muslim should use their time and attention for beneficial matters and avoid interfering in affairs that do not concern them.","ar":"مِنْ كَمَالِ إِسْلَامِ الْمَرْءِ أَنْ يَشْتَغِلَ بِمَا يَنْفَعُهُ وَيَتْرُكَ مَا لَا يَعْنِيهِ."},"n":["Abu Hurairah"],"na":["أبو هريرة"],"hn":["رضي الله عنه"],"im":["ti","ma"],"no":[2318,3976],"g":"h","s":"HR. At-Tirmidzi no. 2318 dan Ibnu Majah no. 3976. Hadits hasan.","mk":"رواه الترمذي برقم ٢٣١٨ وابن ماجه برقم ٣٩٧٦، وهو حديث حسن."},{"i":13,"t":{"id":"Mencintai Kebaikan bagi Saudara","en":"Loving Good for Your Brother","ar":"محبة الخير للأخ"},"a":"عَنْ أَبِي حَمْزَةَ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ خَادِمِ رَسُولِ اللَّهِ ﷺ عَنِ النَّبِيِّ ﷺ قَالَ: لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ.","m":{"id":"Dari Abu Hamzah Anas bin Malik رضي الله عنه, pelayan Rasulullah ﷺ, dari Nabi ﷺ, beliau bersabda: Tidak sempurna iman salah seorang di antara kalian sampai ia mencintai bagi saudaranya apa yang ia cintai bagi dirinya sendiri.","en":"On the authority of Abu Hamzah Anas ibn Malik, the servant of the Messenger of Allah ﷺ: The Prophet ﷺ said: None of you truly believes until he loves for his brother what he loves for himself."},"e":{"id":"Kesempurnaan iman menuntut seorang muslim menginginkan kebaikan bagi saudaranya sebagaimana ia menginginkannya bagi dirinya sendiri, termasuk dalam urusan agama dan kebaikan dunia.","en":"The perfection of faith requires a Muslim to wish good for their brother as they wish it for themselves, in matters of religion and worldly goodness.","ar":"مِنْ كَمَالِ الْإِيمَانِ أَنْ يُحِبَّ الْمُسْلِمُ لِأَخِيهِ الْخَيْرَ كَمَا يُحِبُّهُ لِنَفْسِهِ."},"n":["Anas bin Malik"],"na":["أنس بن مالك"],"hn":["رضي الله عنه"],"im":["bu","mu"],"no":[13,45],"g":"","s":"HR. Al-Bukhari no. 13 dan Muslim no. 45","mk":"رواه البخاري برقم ١٣ ومسلم برقم ٤٥."},{"i":14,"t":{"id":"Perkara yang Menyebabkan Halalnya Darah","en":"The Three Legal Cases Concerning a Muslim's Life","ar":"الأمور التي تستوجب القصاص"},"a":"عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ: لَا يَحِلُّ دَمُ امْرِئٍ مُسْلِمٍ يَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنِّي رَسُولُ اللَّهِ إِلَّا بِإِحْدَى ثَلَاثٍ: الثَّيِّبُ الزَّانِي، وَالنَّفْسُ بِالنَّفْسِ، وَالتَّارِكُ لِدِينِهِ الْمُفَارِقُ لِلْجَمَاعَةِ.","m":{"id":"Dari Abdullah bin Mas'ud رضي الله عنه, ia berkata: Rasulullah ﷺ bersabda: Tidak halal darah seorang muslim yang bersaksi bahwa tidak ada sesembahan yang berhak disembah selain Allah dan bahwa aku adalah utusan Allah, kecuali karena salah satu dari tiga perkara: orang yang telah menikah lalu berzina, jiwa dibalas dengan jiwa, dan orang yang meninggalkan agamanya serta memisahkan diri dari jamaah.","en":"On the authority of Abdullah ibn Mas'ud: The Messenger of Allah ﷺ said: The life of a Muslim who testifies that none has the right to be worshipped except Allah and that I am the Messenger of Allah is not lawful except in one of three cases: a previously married person who commits adultery, a life taken in retribution for a life, and one who abandons their religion and separates from the community."},"e":{"id":"Hadits ini membahas kehormatan jiwa dan ketentuan hukum pidana dalam syariat. Penerapannya merupakan wewenang otoritas hukum yang sah dan harus memenuhi syarat serta proses peradilan; bukan wewenang individu untuk melakukan kekerasan.","en":"This hadith concerns the sanctity of life and legal rulings in Islamic law. Their application belongs to legitimate judicial authority and requires legal conditions and due process; it is not permission for individuals to commit violence.","ar":"يُبَيِّنُ الْحَدِيثُ عِظَمَ حُرْمَةِ الدِّمَاءِ وَأَحْكَامَ الشَّرِيعَةِ، وَتُرْجَعُ إِقَامَةُ الْأَحْكَامِ إِلَى السُّلْطَةِ الشَّرْعِيَّةِ وَالْقَضَاءِ."},"n":["Abdullah bin Mas'ud"],"na":["عبد الله بن مسعود"],"hn":["رضي الله عنه"],"im":["bu","mu"],"no":[6878,1676],"g":"","s":"HR. Al-Bukhari no. 6878 dan Muslim no. 1676","mk":"رواه البخاري برقم ٦٨٧٨ ومسلم برقم ١٦٧٦."},{"i":15,"t":{"id":"Memuliakan Tetangga dan Tamu","en":"Honoring Neighbors and Guests","ar":"إكرام الجار والضيف"},"a":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ: مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ جَارَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ ضَيْفَهُ.","m":{"id":"Dari Abu Hurairah رضي الله عنه, bahwa Rasulullah ﷺ bersabda: Barang siapa beriman kepada Allah dan hari akhir, hendaklah ia berkata yang baik atau diam. Barang siapa beriman kepada Allah dan hari akhir, hendaklah ia memuliakan tetangganya. Barang siapa beriman kepada Allah dan hari akhir, hendaklah ia memuliakan tamunya.","en":"On the authority of Abu Hurairah: The Messenger of Allah ﷺ said: Whoever believes in Allah and the Last Day should speak good or remain silent. Whoever believes in Allah and the Last Day should honor their neighbor. Whoever believes in Allah and the Last Day should honor their guest."},"e":{"id":"Hadits ini mengajarkan tiga adab penting: menjaga lisan, berbuat baik kepada tetangga, dan memuliakan tamu. Ketiganya merupakan bagian dari kesempurnaan iman.","en":"This hadith teaches three important manners: guarding one's speech, treating neighbors well and honoring guests. All three are part of the perfection of faith.","ar":"يُعَلِّمُنَا الْحَدِيثُ حِفْظَ اللِّسَانِ وَالْإِحْسَانَ إِلَى الْجَارِ وَإِكْرَامَ الضَّيْفِ."},"n":["Abu Hurairah"],"na":["أبو هريرة"],"hn":["رضي الله عنه"],"im":["bu","mu"],"no":[6018,47],"g":"","s":"HR. Al-Bukhari no. 6018 dan Muslim no. 47","mk":"رواه البخاري برقم ٦٠١٨ ومسلم برقم ٤٧."},{"i":16,"t":{"id":"Jangan Marah","en":"Do Not Become Angry","ar":"لا تغضب"},"a":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ أَنَّ رَجُلًا قَالَ لِلنَّبِيِّ ﷺ: أَوْصِنِي. قَالَ: «لَا تَغْضَبْ». فَرَدَّدَ مِرَارًا، قَالَ: «لَا تَغْضَبْ».","m":{"id":"Dari Abu Hurairah رضي الله عنه, bahwa seseorang berkata kepada Nabi ﷺ, “Berilah aku nasihat.” Beliau bersabda, “Jangan marah.” Orang itu mengulangi permintaannya beberapa kali, tetapi beliau tetap bersabda, “Jangan marah.”","en":"Abu Hurairah رضي الله عنه reported that a man said to the Prophet ﷺ, “Advise me.” He replied, “Do not become angry.” The man repeated his request several times, and the Prophet ﷺ continued to say, “Do not become angry.”"},"e":{"id":"Hadits ini mengajarkan pentingnya mengendalikan amarah. Bukan berarti seseorang tidak boleh merasakan marah, tetapi ia tidak boleh membiarkan amarah mendorongnya kepada ucapan dan perbuatan yang dilarang Allah. Menahan diri ketika marah merupakan bentuk kekuatan dan akhlak yang mulia.","en":"This hadith teaches the importance of controlling anger. It does not mean that a person will never feel anger, but that anger must not lead them to forbidden words or actions. Restraining oneself when angry is a sign of strength and noble character.","ar":"يُعَلِّمُنَا هَذَا الْحَدِيثُ ضَرُورَةَ ضَبْطِ الْغَضَبِ، وَأَلَّا يَدْفَعَ الْإِنْسَانَ إِلَى الْقَوْلِ أَوِ الْفِعْلِ الْمُحَرَّمِ."},"n":["Abu Hurairah"],"na":["أبو هريرة"],"hn":["رضي الله عنه"],"im":["bu"],"no":[6116],"g":"","s":"Shahih Al-Bukhari no. 6116","mk":"رواه البخاري برقم ٦١١٦."},{"i":17,"t":{"id":"Berbuat Ihsan dalam Segala Hal","en":"Excellence in All Things","ar":"الإحسان في كل شيء"},"a":"عَنْ أَبِي يَعْلَى شَدَّادِ بْنِ أَوْسٍ رَضِيَ اللَّهُ عَنْهُ، عَنْ رَسُولِ اللَّهِ ﷺ قَالَ: «إِنَّ اللَّهَ كَتَبَ الْإِحْسَانَ عَلَى كُلِّ شَيْءٍ، فَإِذَا قَتَلْتُمْ فَأَحْسِنُوا الْقِتْلَةَ، وَإِذَا ذَبَحْتُمْ فَأَحْسِنُوا الذِّبْحَ، وَلْيُحِدَّ أَحَدُكُمْ شَفْرَتَهُ، وَلْيُرِحْ ذَبِيحَتَهُ».","m":{"id":"Dari Abu Ya'la Syaddad bin Aus رضي الله عنه, dari Rasulullah ﷺ, beliau bersabda, “Sesungguhnya Allah menetapkan ihsan dalam segala sesuatu. Jika kalian membunuh, lakukanlah dengan cara yang baik. Jika kalian menyembelih, lakukanlah dengan cara yang baik. Hendaklah salah seorang dari kalian menajamkan pisaunya dan membuat hewan sembelihannya merasa nyaman.”","en":"Abu Ya'la Shaddad ibn Aws رضي الله عنه reported that the Messenger of Allah ﷺ said, “Indeed, Allah has prescribed excellence in all things. So when you kill, do so in a good manner; and when you slaughter, do so in a good manner. Let one of you sharpen his blade and spare suffering to the animal he slaughters.”"},"e":{"id":"Ihsan berarti melakukan sesuatu dengan sebaik-baiknya sesuai tuntunan syariat. Bahkan ketika melakukan tindakan yang dibolehkan seperti penyembelihan hewan, seorang Muslim tetap diperintahkan untuk menghindari penderitaan yang tidak perlu. Islam mengajarkan kasih sayang dan kebaikan, termasuk kepada hewan.","en":"Ihsan means doing things in the best manner according to Islamic guidance. Even in permitted actions such as slaughtering an animal, a Muslim is instructed to avoid unnecessary suffering. Islam teaches mercy and kindness, including towards animals.","ar":"الْإِحْسَانُ هُوَ إِتْقَانُ الْعَمَلِ وَفِعْلُهُ عَلَى الْوَجْهِ الْمَشْرُوعِ، وَيَدُلُّ الْحَدِيثُ عَلَى رَحْمَةِ الْإِسْلَامِ بِالْحَيَوَانِ وَالنَّهْيِ عَنْ تَعْذِيبِهِ."},"n":["Abu Ya'la Syaddad bin Aus"],"na":["أبو يعلى شداد بن أوس"],"hn":["رضي الله عنه"],"im":["mu"],"no":[1955],"g":"","s":"Shahih Muslim no. 1955","mk":"رواه مسلم برقم ١٩٥٥."},{"i":18,"t":{"id":"Bertakwalah di Mana Pun Berada","en":"Be Mindful of Allah Wherever You Are","ar":"اتق الله حيثما كنت"},"a":"عَنْ أَبِي ذَرٍّ جُنْدُبِ بْنِ جُنَادَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ: «اتَّقِ اللَّهَ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا، وَخَالِقِ النَّاسَ بِخُلُقٍ حَسَنٍ».","m":{"id":"Dari Abu Dzarr Jundub bin Junadah رضي الله عنه, ia berkata bahwa Rasulullah ﷺ bersabda, “Bertakwalah kepada Allah di mana pun engkau berada. Iringilah keburukan dengan kebaikan, niscaya kebaikan itu akan menghapusnya. Dan bergaullah dengan manusia dengan akhlak yang baik.”","en":"Abu Dharr Jundub ibn Junadah رضي الله عنه reported that the Messenger of Allah ﷺ said, “Fear Allah wherever you are. Follow a bad deed with a good deed and it will erase it. And treat people with good character.”"},"e":{"id":"Hadits ini memuat tiga nasihat besar: menjaga takwa dalam keadaan apa pun, segera melakukan kebaikan setelah terjatuh dalam kesalahan, dan memperlakukan manusia dengan akhlak yang baik. Kesalahan tidak seharusnya membuat seseorang berputus asa, tetapi mendorongnya untuk bertobat dan memperbaiki diri.","en":"This hadith contains three important teachings: maintaining taqwa in every situation, following a mistake with good deeds, and treating people with good character. A mistake should not lead to despair, but should encourage repentance and self-improvement.","ar":"يَجْمَعُ هَذَا الْحَدِيثُ ثَلَاثَ وَصَايَا: تَقْوَى اللَّهِ فِي كُلِّ حَالٍ، وَإِتْبَاعُ السَّيِّئَةِ بِالْحَسَنَةِ، وَحُسْنُ مُعَامَلَةِ النَّاسِ."},"n":["Abu Dzarr Al-Ghifari"],"na":["أبو ذر الغفاري"],"hn":["رضي الله عنه"],"im":["ti"],"no":[1987],"g":"hs","s":"Jami' At-Tirmidzi no. 1987 — dinilai hasan shahih oleh At-Tirmidzi","mk":"رواه الترمذي برقم ١٩٨٧، وقال: حسن صحيح."},{"i":19,"t":{"id":"Jagalah Allah, Niscaya Allah Menjagamu","en":"Be Mindful of Allah, and He Will Protect You","ar":"احفظ الله يحفظك"},"a":"عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: كُنْتُ خَلْفَ رَسُولِ اللَّهِ ﷺ يَوْمًا، فَقَالَ: «يَا غُلَامُ، إِنِّي أُعَلِّمُكَ كَلِمَاتٍ: احْفَظِ اللَّهَ يَحْفَظْكَ، احْفَظِ اللَّهَ تَجِدْهُ تُجَاهَكَ، إِذَا سَأَلْتَ فَاسْأَلِ اللَّهَ، وَإِذَا اسْتَعَنْتَ فَاسْتَعِنْ بِاللَّهِ، وَاعْلَمْ أَنَّ الْأُمَّةَ لَوِ اجْتَمَعَتْ عَلَى أَنْ يَنْفَعُوكَ بِشَيْءٍ لَمْ يَنْفَعُوكَ إِلَّا بِشَيْءٍ قَدْ كَتَبَهُ اللَّهُ لَكَ، وَإِنِ اجْتَمَعُوا عَلَى أَنْ يَضُرُّوكَ بِشَيْءٍ لَمْ يَضُرُّوكَ إِلَّا بِشَيْءٍ قَدْ كَتَبَهُ اللَّهُ عَلَيْكَ، رُفِعَتِ الْأَقْلَامُ وَجَفَّتِ الصُّحُفُ».","m":{"id":"Dari Ibnu Abbas رضي الله عنهما, ia berkata, “Suatu hari aku pernah berada di belakang Rasulullah ﷺ. Beliau bersabda, ‘Wahai anak muda, aku akan mengajarkan kepadamu beberapa kalimat: Jagalah Allah, niscaya Allah akan menjagamu. Jagalah Allah, niscaya engkau akan mendapati-Nya di hadapanmu. Jika engkau meminta, mintalah kepada Allah. Jika engkau memohon pertolongan, mohonlah pertolongan kepada Allah. Ketahuilah, seandainya seluruh umat berkumpul untuk memberimu suatu manfaat, mereka tidak akan dapat memberimu manfaat kecuali sesuatu yang telah Allah tetapkan bagimu. Dan jika mereka berkumpul untuk mencelakakanmu, mereka tidak akan dapat mencelakakanmu kecuali sesuatu yang telah Allah tetapkan atasmu. Pena-pena telah diangkat dan lembaran-lembaran telah mengering.’”","en":"Ibn Abbas رضي الله عنهما reported: One day I was riding behind the Messenger of Allah ﷺ, and he said, “Young man, I will teach you some words: Be mindful of Allah, and He will protect you. Be mindful of Allah, and you will find Him before you. If you ask, ask Allah; and if you seek help, seek help from Allah. Know that if the whole nation gathered to benefit you, they could benefit you only with what Allah has already written for you. And if they gathered to harm you, they could harm you only with what Allah has already written against you. The pens have been lifted and the pages have dried.”"},"e":{"id":"Makna menjaga Allah adalah menjaga batasan, perintah, dan larangan-Nya. Hadits ini mengajarkan tauhid, tawakal, serta keyakinan terhadap takdir Allah. Manusia boleh menjadi sebab datangnya manfaat atau bahaya, tetapi semuanya tetap berada di bawah ketetapan Allah. Karena itu, seorang hamba hendaknya menggantungkan hati dan permohonannya kepada Allah.","en":"Being mindful of Allah means observing His commands and limits. This hadith teaches tawhid, reliance upon Allah, and belief in divine decree. People may be means through which benefit or harm occurs, but everything remains under Allah's decree. A believer should therefore direct their deepest reliance and requests to Allah.","ar":"مَعْنَى حِفْظِ اللَّهِ حِفْظُ أَوَامِرِهِ وَحُدُودِهِ، وَيَدُلُّ الْحَدِيثُ عَلَى التَّوْحِيدِ وَالتَّوَكُّلِ وَالْإِيمَانِ بِالْقَدَرِ."},"n":["Abdullah bin Abbas"],"na":["عبد الله بن عباس"],"hn":["رضي الله عنهما"],"im":["ti"],"no":[2516],"g":"hs","s":"Jami' At-Tirmidzi no. 2516 — dinilai hasan shahih","mk":"رواه الترمذي برقم ٢٥١٦، وهو حديث حسن صحيح."},{"i":20,"t":{"id":"Jika Tidak Malu, Berbuatlah Sesukamu","en":"If You Feel No Shame, Do As You Wish","ar":"إذا لم تستح فاصنع ما شئت"},"a":"عَنْ أَبِي مَسْعُودٍ عُقْبَةَ بْنِ عَمْرٍو الْأَنْصَارِيِّ الْبَدْرِيِّ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ: «إِنَّ مِمَّا أَدْرَكَ النَّاسُ مِنْ كَلَامِ النُّبُوَّةِ الْأُولَى: إِذَا لَمْ تَسْتَحِ فَاصْنَعْ مَا شِئْتَ».","m":{"id":"Dari Abu Mas'ud Uqbah bin Amr Al-Anshari Al-Badri رضي الله عنه, ia berkata bahwa Rasulullah ﷺ bersabda, “Sesungguhnya di antara perkataan kenabian terdahulu yang masih dikenal manusia adalah: Jika engkau tidak memiliki rasa malu, berbuatlah sesukamu.”","en":"Abu Mas'ud Uqbah ibn Amr al-Ansari al-Badri رضي الله عنه reported that the Messenger of Allah ﷺ said, “Among the words of the earlier prophethood that have reached people is: If you feel no shame, then do as you wish.”"},"e":{"id":"Rasa malu yang terpuji merupakan bagian dari iman dan menjadi penghalang seseorang dari perbuatan buruk. Kalimat “berbuatlah sesukamu” bukan izin untuk melakukan apa saja, melainkan peringatan: jika seseorang sudah kehilangan rasa malu kepada Allah, ia akan mudah melakukan keburukan tanpa merasa bersalah. Karena itu, malu harus dijaga selama tidak menghalangi kebenaran.","en":"Praised modesty is part of faith and prevents a person from wrongdoing. The phrase “do as you wish” is not permission to do anything; it is a warning that when someone loses their sense of shame before Allah, they may commit wrongdoing without remorse. Modesty should be preserved, as long as it does not prevent a person from standing for the truth.","ar":"الْحَيَاءُ الْمَحْمُودُ مِنَ الْإِيمَانِ، وَهُوَ يَمْنَعُ الْإِنْسَانَ مِنَ الْقَبَائِحِ. وَقَوْلُهُ «فَاصْنَعْ مَا شِئْتَ» لَيْسَ إِذْنًا بِالْمَعَاصِي، بَلْ هُوَ تَحْذِيرٌ مِنْ فَقْدَانِ الْحَيَاءِ."},"n":["Abu Mas'ud Al-Anshari"],"na":["أبو مسعود الأنصاري"],"hn":["رضي الله عنه"],"im":["bu"],"no":[3483],"g":"","s":"Shahih Al-Bukhari no. 3483","mk":"رواه البخاري برقم ٣٤٨٣."},{"i":21,"t":{"id":"Berimanlah, Kemudian Istiqamahlah","en":"Believe in Allah, Then Remain Steadfast","ar":"قل آمنت بالله ثم استقم"},"a":"عَنْ أَبِي عَمْرٍو، وَقِيلَ: أَبِي عَمْرَةَ، سُفْيَانَ بْنِ عَبْدِ اللَّهِ الثَّقَفِيِّ رَضِيَ اللَّهُ عَنْهُ قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، قُلْ لِي فِي الْإِسْلَامِ قَوْلًا لَا أَسْأَلُ عَنْهُ أَحَدًا غَيْرَكَ. قَالَ: «قُلْ: آمَنْتُ بِاللَّهِ، ثُمَّ اسْتَقِمْ».","m":{"id":"Dari Abu Amr, dan ada yang mengatakan Abu Amrah, Sufyan bin Abdullah Ats-Tsaqafi رضي الله عنه, ia berkata: Aku bertanya, “Wahai Rasulullah, katakanlah kepadaku suatu perkataan tentang Islam yang tidak perlu aku tanyakan lagi kepada siapa pun selain engkau.” Beliau menjawab, “Katakanlah: Aku beriman kepada Allah, kemudian istiqamahlah.”","en":"Abu Amr, also known as Abu Amrah, Sufyan ibn Abdullah Ath-Thaqafi رضي الله عنه reported: I said, “O Messenger of Allah, tell me something about Islam that I will not need to ask anyone else about.” He replied, “Say: I believe in Allah, then remain steadfast.”"},"e":{"id":"Iman bukan hanya pengakuan dengan lisan, tetapi juga keyakinan hati dan amal anggota badan. Istiqamah berarti terus berada di atas ketaatan kepada Allah, menjalankan perintah-Nya dan menjauhi larangan-Nya. Hadits ini merangkum dua prinsip besar: tauhid dan konsisten dalam ketaatan.","en":"Faith is not merely a statement of the tongue; it includes conviction in the heart and actions of the limbs. Steadfastness means remaining obedient to Allah by fulfilling His commands and avoiding His prohibitions. This hadith summarizes two major principles: tawhid and consistency in obedience.","ar":"الْإِيمَانُ يَشْمَلُ اعْتِقَادَ الْقَلْبِ وَقَوْلَ اللِّسَانِ وَعَمَلَ الْجَوَارِحِ، وَالِاسْتِقَامَةُ هِيَ الثَّبَاتُ عَلَى طَاعَةِ اللَّهِ وَاجْتِنَابُ مَعْصِيَتِهِ."},"n":["Sufyan bin Abdullah"],"na":["سفيان بن عبد الله"],"hn":["رضي الله عنه"],"im":["mu"],"no":[38],"g":"","s":"Shahih Muslim no. 38","mk":"رواه مسلم برقم ٣٨."},{"i":22,"t":{"id":"Jalan Menuju Surga","en":"The Path to Paradise","ar":"الطريق إلى الجنة"},"a":"عَنْ أَبِي عَبْدِ اللَّهِ جَابِرِ بْنِ عَبْدِ اللَّهِ الْأَنْصَارِيِّ رَضِيَ اللَّهُ عَنْهُمَا: أَنَّ رَجُلًا سَأَلَ رَسُولَ اللَّهِ ﷺ فَقَالَ: أَرَأَيْتَ إِذَا صَلَّيْتُ الْمَكْتُوبَاتِ، وَصُمْتُ رَمَضَانَ، وَأَحْلَلْتُ الْحَلَالَ، وَحَرَّمْتُ الْحَرَامَ، وَلَمْ أَزِدْ عَلَى ذَلِكَ شَيْئًا، أَأَدْخُلُ الْجَنَّةَ؟ قَالَ: «نَعَمْ».","m":{"id":"Dari Abu Abdullah Jabir bin Abdullah Al-Anshari رضي الله عنهما, bahwa seseorang bertanya kepada Rasulullah ﷺ, “Bagaimana menurutmu jika aku melaksanakan shalat-shalat wajib, berpuasa pada bulan Ramadan, menghalalkan yang halal, mengharamkan yang haram, dan tidak menambah apa pun dari itu, apakah aku akan masuk surga?” Beliau menjawab, “Ya.”","en":"Jabir ibn Abdullah al-Ansari رضي الله عنهما reported that a man asked the Messenger of Allah ﷺ, “What do you think if I perform the obligatory prayers, fast during Ramadan, regard what is lawful as lawful, regard what is forbidden as forbidden, and do nothing beyond that? Will I enter Paradise?” He replied, “Yes.”"},"e":{"id":"Hadits ini menunjukkan besarnya keutamaan menjaga kewajiban agama dan menjauhi perkara yang diharamkan. Menghalalkan yang halal berarti mengerjakannya dengan meyakini kehalalannya, sedangkan mengharamkan yang haram berarti meninggalkannya. Hadits ini tidak berarti bahwa amalan sunnah tidak memiliki keutamaan, melainkan menjelaskan kedudukan kewajiban sebagai dasar keselamatan.","en":"This hadith highlights the importance of fulfilling religious obligations and avoiding forbidden matters. Regarding lawful things as lawful includes accepting their permissibility, while regarding forbidden things as forbidden means avoiding them. It does not deny the virtue of voluntary deeds; rather, it emphasizes the foundational importance of obligatory duties.","ar":"يَدُلُّ الْحَدِيثُ عَلَى عِظَمِ مَكَانَةِ الْفَرَائِضِ وَاجْتِنَابِ الْمُحَرَّمَاتِ، وَأَنَّ الْوَاجِبَاتِ أَصْلٌ عَظِيمٌ فِي طَرِيقِ النَّجَاةِ."},"n":["Jabir bin Abdullah"],"na":["جابر بن عبد الله"],"hn":["رضي الله عنهما"],"im":["mu"],"no":[15],"g":"","s":"Shahih Muslim no. 15","mk":"رواه مسلم برقم ١٥."},{"i":23,"t":{"id":"Bersuci adalah Setengah dari Iman","en":"Purification Is Half of Faith","ar":"الطهور شطر الإيمان"},"a":"عَنْ أَبِي مَالِكٍ الْحَارِثِ بْنِ عَاصِمٍ الْأَشْعَرِيِّ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ: «الطُّهُورُ شَطْرُ الْإِيمَانِ، وَالْحَمْدُ لِلَّهِ تَمْلَأُ الْمِيزَانَ، وَسُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ تَمْلَآنِ - أَوْ تَمْلَأُ - مَا بَيْنَ السَّمَاءِ وَالْأَرْضِ، وَالصَّلَاةُ نُورٌ، وَالصَّدَقَةُ بُرْهَانٌ، وَالصَّبْرُ ضِيَاءٌ، وَالْقُرْآنُ حُجَّةٌ لَكَ أَوْ عَلَيْكَ، كُلُّ النَّاسِ يَغْدُو، فَبَائِعٌ نَفْسَهُ فَمُعْتِقُهَا أَوْ مُوبِقُهَا».","m":{"id":"Dari Abu Malik Al-Harits bin Ashim Al-Asy'ari رضي الله عنه, ia berkata bahwa Rasulullah ﷺ bersabda, “Bersuci adalah setengah dari iman. Alhamdulillah memenuhi timbangan. Subhanallah dan Alhamdulillah memenuhi — atau salah satunya memenuhi — ruang antara langit dan bumi. Shalat adalah cahaya, sedekah adalah bukti, kesabaran adalah sinar, dan Al-Qur'an adalah hujah yang membelamu atau menjadi hujah yang memberatkanmu. Setiap manusia berangkat pada pagi hari, lalu menjual dirinya; ada yang membebaskannya dan ada pula yang membinasakannya.”","en":"Abu Malik al-Harith ibn Asim al-Ash'ari رضي الله عنه reported that the Messenger of Allah ﷺ said, “Purification is half of faith. Alhamdulillah fills the Scale. Subhanallah and Alhamdulillah fill — or one of them fills — what is between the heavens and the earth. Prayer is light, charity is proof, patience is illumination, and the Qur'an is an argument either for you or against you. Every person goes out in the morning, selling themselves; some free themselves and others destroy themselves.”"},"e":{"id":"Hadits ini menjelaskan keutamaan bersuci, dzikir, shalat, sedekah, kesabaran, dan membaca serta mengamalkan Al-Qur'an. Al-Qur'an akan menjadi hujah bagi orang yang beriman kepadanya dan mengamalkannya, tetapi dapat menjadi hujah yang memberatkan orang yang berpaling darinya. Setiap hari manusia melakukan pilihan yang menentukan keselamatan atau kebinasaannya.","en":"This hadith explains the virtues of purification, remembrance of Allah, prayer, charity, patience, and reciting and following the Qur'an. The Qur'an will testify in favor of those who believe in it and act upon it, but may testify against those who turn away from it. Every day, people make choices that lead either to salvation or destruction.","ar":"يُبَيِّنُ الْحَدِيثُ فَضْلَ الطَّهَارَةِ وَالذِّكْرِ وَالصَّلَاةِ وَالصَّدَقَةِ وَالصَّبْرِ، وَأَنَّ الْقُرْآنَ حُجَّةٌ لِلْعَبْدِ إِذَا عَمِلَ بِهِ، أَوْ عَلَيْهِ إِذَا أَعْرَضَ عَنْهُ."},"n":["Abu Malik Al-Asy'ari"],"na":["أبو مالك الأشعري"],"hn":["رضي الله عنه"],"im":["mu"],"no":[223],"g":"","s":"Shahih Muslim no. 223","mk":"رواه مسلم برقم ٢٢٣."},{"i":24,"t":{"id":"Larangan Berbuat Zalim","en":"The Prohibition of Injustice","ar":"تحريم الظلم"},"a":"عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ رَضِيَ اللَّهُ عَنْهُ، عَنِ النَّبِيِّ ﷺ فِيمَا يَرْوِيهِ عَنْ رَبِّهِ تَبَارَكَ وَتَعَالَى أَنَّهُ قَالَ: «يَا عِبَادِي، إِنِّي حَرَّمْتُ الظُّلْمَ عَلَى نَفْسِي، وَجَعَلْتُهُ بَيْنَكُمْ مُحَرَّمًا، فَلَا تَظَالَمُوا. يَا عِبَادِي، كُلُّكُمْ ضَالٌّ إِلَّا مَنْ هَدَيْتُهُ، فَاسْتَهْدُونِي أَهْدِكُمْ. يَا عِبَادِي، كُلُّكُمْ جَائِعٌ إِلَّا مَنْ أَطْعَمْتُهُ، فَاسْتَطْعِمُونِي أُطْعِمْكُمْ. يَا عِبَادِي، كُلُّكُمْ عَارٍ إِلَّا مَنْ كَسَوْتُهُ، فَاسْتَكْسُونِي أَكْسُكُمْ. يَا عِبَادِي، إِنَّكُمْ تُخْطِئُونَ بِاللَّيْلِ وَالنَّهَارِ، وَأَنَا أَغْفِرُ الذُّنُوبَ جَمِيعًا، فَاسْتَغْفِرُونِي أَغْفِرْ لَكُمْ. يَا عِبَادِي، إِنَّكُمْ لَنْ تَبْلُغُوا ضُرِّي فَتَضُرُّونِي، وَلَنْ تَبْلُغُوا نَفْعِي فَتَنْفَعُونِي. يَا عِبَادِي، لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ كَانُوا عَلَى أَتْقَى قَلْبِ رَجُلٍ وَاحِدٍ مِنْكُمْ، مَا زَادَ ذَلِكَ فِي مُلْكِي شَيْئًا. يَا عِبَادِي، لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ كَانُوا عَلَى أَفْجَرِ قَلْبِ رَجُلٍ وَاحِدٍ مِنْكُمْ، مَا نَقَصَ ذَلِكَ مِنْ مُلْكِي شَيْئًا. يَا عِبَادِي، لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ قَامُوا فِي صَعِيدٍ وَاحِدٍ فَسَأَلُونِي، فَأَعْطَيْتُ كُلَّ إِنْسَانٍ مَسْأَلَتَهُ، مَا نَقَصَ ذَلِكَ مِمَّا عِنْدِي إِلَّا كَمَا يَنْقُصُ الْمِخْيَطُ إِذَا أُدْخِلَ الْبَحْرَ. يَا عِبَادِي، إِنَّمَا هِيَ أَعْمَالُكُمْ أُحْصِيهَا لَكُمْ، ثُمَّ أُوَفِّيكُمْ إِيَّاهَا، فَمَنْ وَجَدَ خَيْرًا فَلْيَحْمَدِ اللَّهَ، وَمَنْ وَجَدَ غَيْرَ ذَلِكَ فَلَا يَلُومَنَّ إِلَّا نَفْسَهُ».","m":{"id":"Dari Abu Dzarr Al-Ghifari رضي الله عنه, dari Nabi ﷺ, dalam riwayat yang beliau sampaikan dari Rabbnya, Allah Tabaraka wa Ta'ala berfirman, “Wahai hamba-hamba-Ku, sesungguhnya Aku mengharamkan kezaliman atas diri-Ku dan Aku menjadikannya haram di antara kalian, maka janganlah kalian saling menzalimi. Wahai hamba-hamba-Ku, kalian semua tersesat kecuali orang yang Aku beri petunjuk, maka mintalah petunjuk kepada-Ku, niscaya Aku akan memberi kalian petunjuk. Wahai hamba-hamba-Ku, kalian semua lapar kecuali orang yang Aku beri makan, maka mintalah makanan kepada-Ku, niscaya Aku akan memberi kalian makan. Wahai hamba-hamba-Ku, kalian semua tidak berpakaian kecuali orang yang Aku beri pakaian, maka mintalah pakaian kepada-Ku, niscaya Aku akan memberi kalian pakaian. Wahai hamba-hamba-Ku, kalian berbuat kesalahan pada malam dan siang hari, sedangkan Aku mengampuni seluruh dosa, maka mintalah ampun kepada-Ku, niscaya Aku mengampuni kalian. Wahai hamba-hamba-Ku, kalian tidak akan mampu memberikan mudarat kepada-Ku dan tidak pula mampu memberikan manfaat kepada-Ku. Wahai hamba-hamba-Ku, seandainya orang-orang terdahulu dan yang terakhir, manusia dan jin, semuanya memiliki hati paling bertakwa seperti satu orang paling bertakwa di antara kalian, hal itu tidak menambah kerajaan-Ku sedikit pun. Wahai hamba-hamba-Ku, seandainya mereka semua memiliki hati paling durhaka seperti satu orang paling durhaka di antara kalian, hal itu tidak mengurangi kerajaan-Ku sedikit pun. Wahai hamba-hamba-Ku, seandainya orang-orang terdahulu dan yang terakhir, manusia dan jin, berkumpul di satu tempat lalu meminta kepada-Ku, kemudian Aku memberikan kepada setiap orang apa yang dimintanya, hal itu tidak mengurangi apa yang ada pada-Ku kecuali seperti berkurangnya air laut ketika sebuah jarum dicelupkan ke dalamnya. Wahai hamba-hamba-Ku, sesungguhnya semua itu hanyalah amal-amal kalian yang Aku hitung untuk kalian, kemudian Aku sempurnakan balasannya kepada kalian. Barang siapa mendapatkan kebaikan, hendaklah ia memuji Allah. Dan barang siapa mendapatkan selain itu, janganlah ia mencela kecuali dirinya sendiri.”","en":"Abu Dharr al-Ghifari رضي الله عنه reported that the Prophet ﷺ narrated from his Lord, Allah, the Blessed and Exalted, who said: “O My servants, I have forbidden injustice for Myself and have made it forbidden among you, so do not wrong one another. O My servants, all of you are misguided except those whom I guide, so ask Me for guidance and I will guide you. O My servants, all of you are hungry except those whom I feed, so ask Me for food and I will feed you. O My servants, all of you are unclothed except those whom I clothe, so ask Me for clothing and I will clothe you. O My servants, you commit sins by night and day, and I forgive all sins, so ask Me for forgiveness and I will forgive you. O My servants, you can neither harm Me nor benefit Me. O My servants, if the first and last of you, the humans and jinn among you, were as pious as the most pious heart of one man among you, that would not increase My dominion in anything. O My servants, if the first and last of you, the humans and jinn among you, were as wicked as the most wicked heart of one man among you, that would not decrease My dominion in anything. O My servants, if the first and last of you, the humans and jinn among you, stood together in one place and asked Me, and I gave each person what they requested, that would not diminish what I possess any more than a needle diminishes the sea when dipped into it. O My servants, these are only your deeds which I record for you; then I will repay you for them in full. Whoever finds good, let him praise Allah. Whoever finds otherwise, let him blame no one but himself.”"},"e":{"id":"Ini adalah hadits qudsi, yaitu hadits yang Nabi ﷺ riwayatkan dari Allah. Hadits ini menegaskan bahwa Allah Mahasuci dari kezaliman, seluruh makhluk membutuhkan petunjuk dan pertolongan-Nya, serta Allah tidak membutuhkan makhluk sedikit pun. Hadits ini juga mengajarkan luasnya ampunan Allah, pentingnya istighfar, dan keadilan balasan berdasarkan amal manusia.","en":"This is a hadith qudsi, in which the Prophet ﷺ narrates words from Allah. It establishes that Allah is free from injustice, while all creation depends upon His guidance and provision. Allah has no need of His creation. The hadith also teaches the vastness of His forgiveness, the importance of seeking forgiveness, and the justice of recompense according to one's deeds.","ar":"هَذَا حَدِيثٌ قُدْسِيٌّ يَدُلُّ عَلَى تَنْزِيهِ اللَّهِ عَنِ الظُّلْمِ، وَافْتِقَارِ الْخَلْقِ إِلَى هِدَايَتِهِ وَرِزْقِهِ وَمَغْفِرَتِهِ، وَأَنَّ اللَّهَ غَنِيٌّ عَنْ خَلْقِهِ، وَأَنَّ الْعِبَادَ يُجْزَوْنَ بِأَعْمَالِهِمْ."},"n":["Abu Dzarr Al-Ghifari"],"na":["أبو ذر الغفاري"],"hn":["رضي الله عنه"],"im":["mu"],"no":[2577],"g":"","s":"Shahih Muslim no. 2577","mk":"رواه مسلم برقم ٢٥٧٧."},{"i":25,"t":{"id":"Keutamaan Dzikir dan Sedekah","en":"The Virtue of Remembrance and Charity","ar":"فضل الذكر والصدقة"},"a":"عَنْ أَبِي ذَرٍّ رَضِيَ اللَّهُ عَنْهُ أَيْضًا: أَنَّ نَاسًا مِنْ أَصْحَابِ رَسُولِ اللَّهِ ﷺ قَالُوا لِلنَّبِيِّ ﷺ: يَا رَسُولَ اللَّهِ، ذَهَبَ أَهْلُ الدُّثُورِ بِالْأُجُورِ، يُصَلُّونَ كَمَا نُصَلِّي، وَيَصُومُونَ كَمَا نَصُومُ، وَيَتَصَدَّقُونَ بِفُضُولِ أَمْوَالِهِمْ. قَالَ: «أَوَلَيْسَ قَدْ جَعَلَ اللَّهُ لَكُمْ مَا تَصَدَّقُونَ؟ إِنَّ بِكُلِّ تَسْبِيحَةٍ صَدَقَةً، وَكُلِّ تَكْبِيرَةٍ صَدَقَةً، وَكُلِّ تَحْمِيدَةٍ صَدَقَةً، وَكُلِّ تَهْلِيلَةٍ صَدَقَةً، وَأَمْرٌ بِالْمَعْرُوفِ صَدَقَةٌ، وَنَهْيٌ عَنْ مُنْكَرٍ صَدَقَةٌ، وَفِي بُضْعِ أَحَدِكُمْ صَدَقَةٌ». قَالُوا: يَا رَسُولَ اللَّهِ، أَيَأْتِي أَحَدُنَا شَهْوَتَهُ وَيَكُونُ لَهُ فِيهَا أَجْرٌ؟ قَالَ: «أَرَأَيْتُمْ لَوْ وَضَعَهَا فِي حَرَامٍ أَكَانَ عَلَيْهِ وِزْرٌ؟ فَكَذَلِكَ إِذَا وَضَعَهَا فِي الْحَلَالِ كَانَ لَهُ أَجْرٌ».","m":{"id":"Dari Abu Dzarr رضي الله عنه juga, bahwa sejumlah sahabat Rasulullah ﷺ berkata kepada Nabi ﷺ, “Wahai Rasulullah, orang-orang kaya telah membawa banyak pahala. Mereka shalat sebagaimana kami shalat, berpuasa sebagaimana kami berpuasa, dan mereka bersedekah dengan kelebihan harta mereka.” Beliau bersabda, “Bukankah Allah telah menjadikan bagi kalian sesuatu yang dapat kalian sedekahkan? Sesungguhnya setiap tasbih adalah sedekah, setiap takbir adalah sedekah, setiap tahmid adalah sedekah, setiap tahlil adalah sedekah, amar makruf adalah sedekah, nahi mungkar adalah sedekah, dan hubungan suami istri kalian pun merupakan sedekah.” Mereka bertanya, “Wahai Rasulullah, apakah seseorang yang menyalurkan syahwatnya juga mendapatkan pahala?” Beliau menjawab, “Bagaimana pendapat kalian jika ia menyalurkannya pada sesuatu yang haram, bukankah ia mendapatkan dosa? Demikian pula jika ia menyalurkannya pada sesuatu yang halal, ia mendapatkan pahala.”","en":"Abu Dharr رضي الله عنه also reported that some of the Companions of the Messenger of Allah ﷺ said to the Prophet ﷺ, “O Messenger of Allah, the wealthy have taken all the rewards. They pray as we pray, fast as we fast, and give charity from their surplus wealth.” He replied, “Has Allah not provided you with things that you can give as charity? Every tasbih is charity, every takbir is charity, every tahmid is charity, every tahlil is charity, enjoining what is right is charity, forbidding what is wrong is charity, and marital intimacy is charity.” They asked, “O Messenger of Allah, does one of us receive a reward for satisfying his desire?” He replied, “Tell me, if he fulfilled it unlawfully, would he not bear a sin? Likewise, if he fulfills it lawfully, he receives a reward.”"},"e":{"id":"Sedekah tidak terbatas pada pemberian harta. Dzikir, amar makruf, nahi mungkar, dan berbagai amal kebaikan juga termasuk sedekah. Bahkan perkara yang secara asal merupakan kebutuhan manusia dapat bernilai ibadah apabila dilakukan melalui jalan yang halal dan dengan niat yang benar. Hadits ini menunjukkan luasnya pintu pahala bagi setiap Muslim, termasuk yang tidak memiliki banyak harta.","en":"Charity is not limited to giving wealth. Remembrance of Allah, enjoining good, forbidding evil, and other righteous actions are also forms of charity. Even ordinary human needs can become acts of worship when fulfilled lawfully and with a sound intention. This hadith shows that the doors of reward are wide open for every Muslim, including those who have little wealth.","ar":"لَيْسَتِ الصَّدَقَةُ مَقْصُورَةً عَلَى بَذْلِ الْمَالِ، بَلْ يَدْخُلُ فِيهَا الذِّكْرُ وَالْأَمْرُ بِالْمَعْرُوفِ وَالنَّهْيُ عَنِ الْمُنْكَرِ، وَتَكُونُ الْمُبَاحَاتُ عِبَادَاتٍ بِالنِّيَّةِ الصَّالِحَةِ وَالْوَجْهِ الْمَشْرُوعِ."},"n":["Abu Dzarr Al-Ghifari"],"na":["أبو ذر الغفاري"],"hn":["رضي الله عنه"],"im":["mu"],"no":[1006],"g":"","s":"Shahih Muslim no. 1006","mk":"رواه مسلم برقم ١٠٠٦."},{"i":26,"t":{"id":"Setiap Persendian Memiliki Sedekah","en":"Every Joint Has a Charity Due","ar":"كل سلامى من الناس عليه صدقة"},"a":"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ: «كُلُّ سُلَامَى مِنَ النَّاسِ عَلَيْهِ صَدَقَةٌ، كُلَّ يَوْمٍ تَطْلُعُ فِيهِ الشَّمْسُ: تَعْدِلُ بَيْنَ اثْنَيْنِ صَدَقَةٌ، وَتُعِينُ الرَّجُلَ فِي دَابَّتِهِ فَتَحْمِلُهُ عَلَيْهَا، أَوْ تَرْفَعُ لَهُ عَلَيْهَا مَتَاعَهُ صَدَقَةٌ، وَالْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ، وَبِكُلِّ خُطْوَةٍ تَمْشِيهَا إِلَى الصَّلَاةِ صَدَقَةٌ، وَتُمِيطُ الْأَذَى عَنِ الطَّرِيقِ صَدَقَةٌ».","m":{"id":"Dari Abu Hurairah رضي الله عنه, ia berkata bahwa Rasulullah ﷺ bersabda, “Setiap persendian manusia wajib disedekahi setiap hari ketika matahari terbit. Mendamaikan dua orang adalah sedekah. Membantu seseorang menaiki kendaraannya atau mengangkat barangnya ke atas kendaraan adalah sedekah. Perkataan yang baik adalah sedekah. Setiap langkah yang engkau ayunkan menuju shalat adalah sedekah. Dan menyingkirkan gangguan dari jalan adalah sedekah.”","en":"Abu Hurairah رضي الله عنه reported that the Messenger of Allah ﷺ said, “Every joint of a person owes a charity each day when the sun rises. Reconciling two people is charity. Helping a person onto his riding animal or lifting his belongings onto it is charity. A good word is charity. Every step you take towards prayer is charity. Removing something harmful from the road is charity.”"},"e":{"id":"Allah memberikan banyak kesempatan bersedekah setiap hari. Sedekah tidak harus berupa uang atau harta. Mendamaikan orang yang berselisih, membantu orang lain, berkata baik, berjalan menuju shalat, dan menyingkirkan gangguan dari jalan semuanya termasuk sedekah. Hadits ini menunjukkan luasnya pintu kebaikan dalam Islam.","en":"Allah provides many opportunities for charity every day. Charity is not limited to money or possessions. Reconciling people, helping others, speaking kindly, walking to prayer, and removing harmful objects from the road are all forms of charity. This hadith shows how broad the doors of goodness are in Islam.","ar":"فَتَحَ اللَّهُ أَبْوَابًا كَثِيرَةً لِلصَّدَقَةِ، فَلَيْسَتِ الصَّدَقَةُ مَقْصُورَةً عَلَى الْمَالِ، بَلْ تَشْمَلُ الْإِصْلَاحَ بَيْنَ النَّاسِ وَمُسَاعَدَةَ الْآخَرِينَ وَالْكَلِمَةَ الطَّيِّبَةَ وَإِمَاطَةَ الْأَذَى."},"n":["Abu Hurairah"],"na":["أبو هريرة"],"hn":["رضي الله عنه"],"im":["bu","mu"],"no":[2989,1009],"g":"","s":"Shahih Al-Bukhari no. 2989 dan Shahih Muslim no. 1009","mk":"رواه البخاري برقم ٢٩٨٩ ومسلم برقم ١٠٠٩."},{"i":27,"t":{"id":"Kebaikan adalah Akhlak yang Baik","en":"Righteousness Is Good Character","ar":"البر حسن الخلق"},"a":"عَنِ النَّوَّاسِ بْنِ سَمْعَانَ رَضِيَ اللَّهُ عَنْهُ، عَنِ النَّبِيِّ ﷺ قَالَ: «الْبِرُّ حُسْنُ الْخُلُقِ، وَالْإِثْمُ مَا حَاكَ فِي صَدْرِكَ، وَكَرِهْتَ أَنْ يَطَّلِعَ عَلَيْهِ النَّاسُ». وَعَنْ وَابِصَةَ بْنِ مَعْبَدٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: أَتَيْتُ رَسُولَ اللَّهِ ﷺ فَقَالَ: «جِئْتَ تَسْأَلُ عَنِ الْبِرِّ؟» قُلْتُ: نَعَمْ. قَالَ: «اسْتَفْتِ قَلْبَكَ، الْبِرُّ مَا اطْمَأَنَّتْ إِلَيْهِ النَّفْسُ، وَاطْمَأَنَّ إِلَيْهِ الْقَلْبُ، وَالْإِثْمُ مَا حَاكَ فِي النَّفْسِ وَتَرَدَّدَ فِي الصَّدْرِ، وَإِنْ أَفْتَاكَ النَّاسُ وَأَفْتَوْكَ».","m":{"id":"Dari An-Nawwas bin Sam'an رضي الله عنه, dari Nabi ﷺ, beliau bersabda, “Kebaikan adalah akhlak yang baik. Dosa adalah sesuatu yang menggelisahkan dadamu dan engkau tidak suka jika orang lain mengetahuinya.” Dari Wabishah bin Ma'bad رضي الله عنه, ia berkata, “Aku mendatangi Rasulullah ﷺ, lalu beliau bertanya, ‘Apakah engkau datang untuk bertanya tentang kebaikan?’ Aku menjawab, ‘Ya.’ Beliau bersabda, ‘Mintalah fatwa kepada hatimu. Kebaikan adalah sesuatu yang membuat jiwa dan hati merasa tenang. Dosa adalah sesuatu yang menggelisahkan jiwa dan membuat dada bimbang, meskipun manusia memberikan fatwa kepadamu.’”","en":"An-Nawwas ibn Sam'an رضي الله عنه reported that the Prophet ﷺ said, “Righteousness is good character, and sin is what troubles your heart and what you dislike people knowing about.” Wabisah ibn Ma'bad رضي الله عنه reported that he came to the Messenger of Allah ﷺ, who asked, “Have you come to ask about righteousness?” He replied, “Yes.” The Prophet ﷺ said, “Consult your heart. Righteousness is that which brings tranquility to the soul and heart. Sin is that which troubles the soul and causes uneasiness in the chest, even if people give you their opinions.”"},"e":{"id":"Hadits ini menjelaskan bahwa akhlak yang baik termasuk inti kebaikan. Dosa sering menimbulkan kegelisahan dalam hati orang beriman. Namun, bagian tentang meminta fatwa kepada hati bukan berarti perasaan pribadi dapat menggantikan Al-Qur'an, Sunnah, atau penjelasan ulama. Hati yang dimaksud adalah hati yang mengenal kebenaran dan tidak mengikuti hawa nafsu.","en":"This hadith teaches that good character is central to righteousness. Sin often causes uneasiness in the heart of a believer. However, consulting one's heart does not mean that personal feelings replace the Qur'an, Sunnah, or scholarly guidance. It refers to a heart that recognizes truth and is not driven by desires.","ar":"يُبَيِّنُ الْحَدِيثُ أَنَّ حُسْنَ الْخُلُقِ مِنْ أَعْظَمِ أَبْوَابِ الْبِرِّ، وَأَنَّ الْمُؤْمِنَ يَسْتَشْعِرُ قَلَقًا مِنَ الْإِثْمِ. وَلَا يَعْنِي اسْتِفْتَاءُ الْقَلْبِ تَرْكَ الْكِتَابِ وَالسُّنَّةِ وَأَقْوَالِ أَهْلِ الْعِلْمِ."},"n":["An-Nawwas bin Sam'an","Wabishah bin Ma'bad"],"na":["النواس بن سمعان","وابصة بن معبد"],"hn":["رضي الله عنه","رضي الله عنه"],"im":["mu","ah","dr"],"no":[2553,0,0],"g":"h","s":"Riwayat An-Nawwas: Shahih Muslim no. 2553. Riwayat Wabishah: Musnad Ahmad dan Sunan Ad-Darimi; dinilai hasan.","mk":"رواه مسلم برقم ٢٥٥٣ من حديث النواس بن سمعان، وأحمد والدارمي من حديث وابصة بن معبد، وهو حديث حسن."},{"i":28,"t":{"id":"Berpegang Teguh kepada Sunnah","en":"Hold Firmly to the Sunnah","ar":"الوصية بتقوى الله ولزوم السنة"},"a":"عَنْ أَبِي نَجِيحٍ الْعِرْبَاضِ بْنِ سَارِيَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: وَعَظَنَا رَسُولُ اللَّهِ ﷺ مَوْعِظَةً وَجِلَتْ مِنْهَا الْقُلُوبُ، وَذَرَفَتْ مِنْهَا الْعُيُونُ، فَقُلْنَا: يَا رَسُولَ اللَّهِ، كَأَنَّهَا مَوْعِظَةُ مُوَدِّعٍ فَأَوْصِنَا. قَالَ: «أُوصِيكُمْ بِتَقْوَى اللَّهِ عَزَّ وَجَلَّ، وَالسَّمْعِ وَالطَّاعَةِ وَإِنْ تَأَمَّرَ عَلَيْكُمْ عَبْدٌ، فَإِنَّهُ مَنْ يَعِشْ مِنْكُمْ فَسَيَرَى اخْتِلَافًا كَثِيرًا، فَعَلَيْكُمْ بِسُنَّتِي وَسُنَّةِ الْخُلَفَاءِ الرَّاشِدِينَ الْمَهْدِيِّينَ، عَضُّوا عَلَيْهَا بِالنَّوَاجِذِ، وَإِيَّاكُمْ وَمُحْدَثَاتِ الْأُمُورِ، فَإِنَّ كُلَّ بِدْعَةٍ ضَلَالَةٌ».","m":{"id":"Dari Abu Najih Al-Irbadh bin Sariyah رضي الله عنه, ia berkata, “Rasulullah ﷺ pernah memberikan nasihat kepada kami yang membuat hati bergetar dan mata berlinang. Kami berkata, ‘Wahai Rasulullah, seakan-akan ini adalah nasihat perpisahan. Maka berilah kami wasiat.’ Beliau bersabda, ‘Aku wasiatkan kepada kalian agar bertakwa kepada Allah عز وجل, serta mendengar dan taat, meskipun yang memimpin kalian adalah seorang hamba sahaya. Sesungguhnya siapa di antara kalian yang hidup setelahku akan melihat banyak perselisihan. Maka wajib atas kalian berpegang teguh kepada Sunnahku dan Sunnah para khalifah yang lurus lagi mendapat petunjuk. Gigitlah Sunnah itu dengan gigi geraham kalian. Jauhilah perkara-perkara baru dalam agama, karena setiap bid'ah adalah kesesatan.’”","en":"Abu Najih al-Irbad ibn Sariyah رضي الله عنه reported: The Messenger of Allah ﷺ gave us an admonition that made our hearts tremble and our eyes shed tears. We said, “O Messenger of Allah, it is as though this is a farewell admonition, so advise us.” He said, “I advise you to have taqwa of Allah, the Mighty and Majestic, and to listen and obey, even if a slave is appointed over you. Those among you who live after me will see much disagreement. So adhere to my Sunnah and the Sunnah of the rightly guided caliphs. Hold firmly to it with your molar teeth. Beware of newly introduced matters in religion, for every innovation is misguidance.”"},"e":{"id":"Hadits ini merupakan wasiat penting tentang takwa, ketaatan dalam perkara yang makruf, dan kewajiban berpegang teguh kepada Sunnah Nabi ﷺ serta Sunnah Khulafaur Rasyidin. Ketika muncul perselisihan, seorang Muslim harus kembali kepada petunjuk wahyu dan pemahaman generasi awal umat Islam. Hadits ini juga memperingatkan agar tidak membuat perkara baru dalam agama yang tidak memiliki dasar syariat.","en":"This hadith contains an important instruction concerning taqwa, obedience in what is right, and adherence to the Sunnah of the Prophet ﷺ and the rightly guided caliphs. When disagreements arise, Muslims should return to revelation and the understanding of the earliest generations. It also warns against introducing unsupported religious practices into the religion.","ar":"يَتَضَمَّنُ الْحَدِيثُ الْوَصِيَّةَ بِتَقْوَى اللَّهِ وَالطَّاعَةِ فِي الْمَعْرُوفِ وَالتَّمَسُّكِ بِسُنَّةِ النَّبِيِّ ﷺ وَسُنَّةِ الْخُلَفَاءِ الرَّاشِدِينَ، وَالتَّحْذِيرَ مِنَ الْبِدَعِ فِي الدِّينِ."},"n":["Al-Irbadh bin Sariyah"],"na":["العرباض بن سارية"],"hn":["رضي الله عنه"],"im":["da","ti"],"no":[4607,2676],"g":"hs","s":"Sunan Abi Dawud no. 4607 dan Jami' At-Tirmidzi no. 2676; At-Tirmidzi menilainya hasan shahih.","mk":"رواه أبو داود برقم ٤٦٠٧ والترمذي برقم ٢٦٧٦، وقال الترمذي: حسن صحيح."},{"i":29,"t":{"id":"Pintu-Pintu Kebaikan dan Penjagaan Lisan","en":"The Gates of Goodness and Guarding the Tongue","ar":"أبواب الخير وحفظ اللسان"},"a":"عَنْ مُعَاذِ بْنِ جَبَلٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، أَخْبِرْنِي بِعَمَلٍ يُدْخِلُنِي الْجَنَّةَ وَيُبَاعِدُنِي مِنَ النَّارِ. قَالَ: «لَقَدْ سَأَلْتَ عَنْ عَظِيمٍ، وَإِنَّهُ لَيَسِيرٌ عَلَى مَنْ يَسَّرَهُ اللَّهُ عَلَيْهِ: تَعْبُدُ اللَّهَ لَا تُشْرِكُ بِهِ شَيْئًا، وَتُقِيمُ الصَّلَاةَ، وَتُؤْتِي الزَّكَاةَ، وَتَصُومُ رَمَضَانَ، وَتَحُجُّ الْبَيْتَ». ثُمَّ قَالَ: «أَلَا أَدُلُّكَ عَلَى أَبْوَابِ الْخَيْرِ؟ الصَّوْمُ جُنَّةٌ، وَالصَّدَقَةُ تُطْفِئُ الْخَطِيئَةَ كَمَا يُطْفِئُ الْمَاءُ النَّارَ، وَصَلَاةُ الرَّجُلِ مِنْ جَوْفِ اللَّيْلِ». ثُمَّ تَلَا: ﴿تَتَجَافَىٰ جُنُوبُهُمْ عَنِ الْمَضَاجِعِ﴾ حَتَّى بَلَغَ ﴿يَعْمَلُونَ﴾. ثُمَّ قَالَ: «أَلَا أُخْبِرُكَ بِرَأْسِ الْأَمْرِ وَعَمُودِهِ وَذِرْوَةِ سَنَامِهِ؟» قُلْتُ: بَلَى يَا رَسُولَ اللَّهِ. قَالَ: «رَأْسُ الْأَمْرِ الْإِسْلَامُ، وَعَمُودُهُ الصَّلَاةُ، وَذِرْوَةُ سَنَامِهِ الْجِهَادُ». ثُمَّ قَالَ: «أَلَا أُخْبِرُكَ بِمِلَاكِ ذَلِكَ كُلِّهِ؟» قُلْتُ: بَلَى يَا نَبِيَّ اللَّهِ. فَأَخَذَ بِلِسَانِهِ فَقَالَ: «كُفَّ عَلَيْكَ هَذَا». قُلْتُ: يَا نَبِيَّ اللَّهِ، وَإِنَّا لَمُؤَاخَذُونَ بِمَا نَتَكَلَّمُ بِهِ؟ فَقَالَ: «ثَكِلَتْكَ أُمُّكَ، وَهَلْ يَكُبُّ النَّاسَ فِي النَّارِ عَلَى وُجُوهِهِمْ - أَوْ قَالَ: عَلَى مَنَاخِرِهِمْ - إِلَّا حَصَائِدُ أَلْسِنَتِهِمْ؟».","m":{"id":"Dari Mu'adz bin Jabal رضي الله عنه, ia berkata, “Aku bertanya, ‘Wahai Rasulullah, beritahukanlah kepadaku suatu amalan yang dapat memasukkanku ke dalam surga dan menjauhkanku dari neraka.’ Beliau menjawab, ‘Sungguh engkau telah menanyakan perkara yang besar, tetapi hal itu mudah bagi orang yang Allah mudahkan baginya: engkau beribadah kepada Allah dan tidak menyekutukan-Nya dengan sesuatu apa pun, mendirikan shalat, menunaikan zakat, berpuasa Ramadan, dan berhaji ke Baitullah.’ Kemudian beliau bersabda, ‘Maukah aku tunjukkan kepadamu pintu-pintu kebaikan? Puasa adalah perisai, sedekah menghapus kesalahan sebagaimana air memadamkan api, dan shalat seseorang pada tengah malam.’ Kemudian beliau membaca ayat, ‘Lambung mereka jauh dari tempat tidurnya,’ hingga ayat ‘mereka kerjakan.’ Kemudian beliau bersabda, ‘Maukah aku beritahukan kepadamu pokok perkara, tiangnya, dan puncaknya?’ Aku menjawab, ‘Tentu, wahai Rasulullah.’ Beliau bersabda, ‘Pokok perkara adalah Islam, tiangnya adalah shalat, dan puncaknya adalah jihad.’ Kemudian beliau bersabda, ‘Maukah aku beritahukan kepadamu sesuatu yang mengendalikan semua itu?’ Aku menjawab, ‘Tentu, wahai Nabi Allah.’ Lalu beliau memegang lidahnya dan bersabda, ‘Jagalah ini.’ Aku bertanya, ‘Wahai Nabi Allah, apakah kami akan dimintai pertanggungjawaban atas apa yang kami ucapkan?’ Beliau menjawab, ‘Celakalah engkau! Bukankah yang paling banyak menjerumuskan manusia ke dalam neraka dengan wajah atau hidung mereka adalah hasil dari ucapan lisan mereka?’”","en":"Mu'adh ibn Jabal رضي الله عنه reported: I said, “O Messenger of Allah, tell me of a deed that will admit me into Paradise and keep me away from the Fire.” He replied, “You have asked about something great, but it is easy for the one for whom Allah makes it easy: worship Allah without associating anything with Him, establish prayer, give zakah, fast Ramadan, and perform pilgrimage to the House.” Then he said, “Shall I show you the gates of goodness? Fasting is a shield; charity extinguishes sin as water extinguishes fire; and a man's prayer in the middle of the night.” Then he recited, “Their sides forsake their beds,” until the verse, “they used to do.” Then he said, “Shall I tell you the head of the matter, its pillar, and its highest part?” I said, “Yes, O Messenger of Allah.” He said, “The head of the matter is Islam, its pillar is prayer, and its highest part is jihad.” Then he said, “Shall I tell you what controls all of that?” I said, “Yes, O Prophet of Allah.” He took hold of his tongue and said, “Restrain this.” I asked, “O Prophet of Allah, will we be held accountable for what we say?” He replied, “May your mother be bereaved of you! Is there anything that throws people into the Fire upon their faces — or their noses — more than the harvests of their tongues?”"},"e":{"id":"Hadits ini merangkum banyak pokok agama: tauhid, rukun Islam, puasa, sedekah, shalat malam, serta kedudukan jihad dalam syariat. Di bagian akhirnya Nabi ﷺ menekankan pentingnya menjaga lisan. Ucapan yang tidak dijaga dapat menjadi sebab dosa besar dan kebinasaan. Karena itu, seorang Muslim hendaknya berbicara dengan kebaikan atau diam dari keburukan.","en":"This hadith brings together many foundations of the religion: tawhid, the pillars of Islam, fasting, charity, night prayer, and the place of jihad in Islamic law. At the end, the Prophet ﷺ emphasizes guarding the tongue. Uncontrolled speech can lead to serious sins and destruction. A Muslim should therefore speak what is good or refrain from harmful speech.","ar":"يَجْمَعُ الْحَدِيثُ أُصُولًا عَظِيمَةً مِنَ الدِّينِ، مِنْهَا التَّوْحِيدُ وَأَرْكَانُ الْإِسْلَامِ وَالنَّوَافِلُ، وَيُؤَكِّدُ فِي آخِرِهِ خَطَرَ اللِّسَانِ وَضَرُورَةَ حِفْظِهِ عَنِ الْقَوْلِ الْمُحَرَّمِ."},"n":["Mu'adz bin Jabal"],"na":["معاذ بن جبل"],"hn":["رضي الله عنه"],"im":["ti"],"no":[2616],"g":"hs","s":"Jami' At-Tirmidzi no. 2616; At-Tirmidzi menilainya hasan shahih.","mk":"رواه الترمذي برقم ٢٦١٦، وقال: حسن صحيح."},{"i":30,"t":{"id":"Menjaga Batasan-Batasan Allah","en":"Respecting the Limits Set by Allah","ar":"الوقوف عند حدود الشرع"},"a":"عَنْ أَبِي ثَعْلَبَةَ الْخُشَنِيِّ جُرْثُومِ بْنِ نَاشِرٍ رَضِيَ اللَّهُ عَنْهُ، عَنْ رَسُولِ اللَّهِ ﷺ قَالَ: «إِنَّ اللَّهَ تَعَالَى فَرَضَ فَرَائِضَ فَلَا تُضَيِّعُوهَا، وَحَدَّ حُدُودًا فَلَا تَعْتَدُوهَا، وَحَرَّمَ أَشْيَاءَ فَلَا تَنْتَهِكُوهَا، وَسَكَتَ عَنْ أَشْيَاءَ رَحْمَةً لَكُمْ غَيْرَ نِسْيَانٍ فَلَا تَبْحَثُوا عَنْهَا».","m":{"id":"Dari Abu Tsa'labah Al-Khusyani Jurtsum bin Nasyir رضي الله عنه, dari Rasulullah ﷺ, beliau bersabda, “Sesungguhnya Allah telah menetapkan berbagai kewajiban, maka janganlah kalian menyia-nyiakannya. Dia telah menetapkan batasan-batasan, maka janganlah kalian melampauinya. Dia telah mengharamkan beberapa perkara, maka janganlah kalian melanggarnya. Dan Dia mendiamkan beberapa perkara sebagai rahmat bagi kalian, bukan karena lupa, maka janganlah kalian mencari-cari tentangnya.”","en":"Abu Tha'labah al-Khushani Jurthum ibn Nashir رضي الله عنه reported that the Messenger of Allah ﷺ said, “Indeed, Allah has prescribed obligations, so do not neglect them. He has set limits, so do not transgress them. He has forbidden certain things, so do not violate them. And He has remained silent about certain matters as a mercy to you, not out of forgetfulness, so do not pursue them.”"},"e":{"id":"Hadits ini menjelaskan empat perkara dalam syariat: kewajiban yang harus dilaksanakan, batasan yang tidak boleh dilampaui, larangan yang harus dijauhi, dan perkara yang tidak dijelaskan secara khusus sebagai bentuk rah
